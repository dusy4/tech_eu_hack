      const brailleSVG = (dots) => G(dots.map((d) => '<circle cx="' + DOTPOS[d][0] + '" cy="' + DOTPOS[d][1] + '" r="7.6" fill="currentColor"/>').join(''));
      const stack = (frames, id, cls) => '<span class="stk' + (cls ? ' ' + cls : '') + '"' + (id ? ' id="' + id + '"' : '') + '>' +
        frames.map((f, i) => '<span class="fr' + (i === 0 ? ' on0' : '') + '">' + f + '</span>').join('') + '</span>';
      const alts = (list, cls) => list.map((s, i) => '<span class="alt' + (i === 0 ? ' on0' : '') + (cls ? ' ' + cls : '') + '">' + s + '</span>').join('');
      // diff helpers: «…» marks the changed words
      const plain = (s) => s.replace(/[«»]/g, '');
      const marked = (s, cls) => esc(s).replace(/«(.*?)»/g, '<span class="' + cls + '">$1</span>');
      // reply text split into word spans (hard-cut chunks, the way a terminal prints a stream)
      function words(segs, codeCls) {
        let out = '';
        segs.forEach((sg) => {
          if (sg.t != null) sg.t.split(/(?<= )/).forEach((w) => { out += '<span class="w">' + esc(w) + '</span>'; });
          else if (sg.b != null) out += '<span class="w"><b>' + esc(sg.b) + '</b></span>';
          else out += '<span class="w"><span class="' + codeCls + '">' + esc(sg.id || sg.code) + '</span></span>';
        });
        return out;
      }
      function printChunks(container, t0, dur, per) {
        const ws = $$('.w', container);
        const n = Math.ceil(ws.length / per);
        ws.forEach((w, i) => tl.set(w, { visibility: 'visible' }, t0 + (n > 1 ? (dur * Math.floor(i / per)) / (n - 1) : 0)));
      }
      // stacked glyph frames: cycle the visible frame every `step` seconds
      function cycleFrames(stackEl, t0, t1, step, seq) {
        const fr = $$('.fr', stackEl);
        seq = seq || fr.map((_, i) => i);
        let k = 0, prev = seq[0];
        for (let t = t0 + step; t < t1 - 1e-6; t += step) {
          k++; const cur = seq[k % seq.length];
          if (cur !== prev) { tl.set(fr[prev], { opacity: 0 }, t); tl.set(fr[cur], { opacity: 1 }, t); }
          prev = cur;
        }
        return prev;
      }
      function toFrame(stackEl, from, idx, t) {
        const fr = $$('.fr', stackEl);
        if (from !== idx) { tl.set(fr[from], { opacity: 0 }, t); tl.set(fr[idx], { opacity: 1 }, t); }
      }
      // alternatives in one slot: alternative k shows from times[k]
      function cycleAlt(els, times) {
        times.forEach((t, k) => { if (k && els[k]) { tl.set(els[k - 1], { display: 'none' }, t); tl.set(els[k], { display: 'inline' }, t); } });
      }
      // a running indicator that dips and always comes back to full opacity
      function blink(x, t0, t1, half) {
        const n = Math.max(1, Math.floor((t1 - t0) / (2 * half)));
        tl.fromTo(x, { opacity: 1 }, { opacity: 0.25, duration: half, ease: 'sine.inOut', yoyo: true, repeat: 2 * n - 1, immediateRender: false }, t0);
      }
      const timerTimes = () => [T.submit, T.submit + 1, T.submit + 2, T.submit + 3];
      const lights = '<span class="lights"><i></i><i></i><i></i></span>';
      // the composer placeholder belongs to GSAP alone: hidden on the first key, back the moment the prompt is sent
      function placeholderState(slot) {
        tl.set(slot, { attr: { 'data-ph': '0' } }, T.typeAt + 1e-3);   // the first key renders on the frame after typeAt
        tl.set(slot, { attr: { 'data-ph': '1' } }, T.submit);
      }

      /* ======================= v0  Claude Code ======================= */
      function buildClaude(C) {
        const g = (n) => SK.g(n), gut = (n) => SK.gut(n);
        const elbow = '<span class="cc-gut">' + gl('elbow') + '</span>';
        const dot = (id) => '<span class="cc-gut">' + stack(['<span style="color:var(--cct-dim)">' + SK.glyphs.dot + '</span>', '<span style="color:var(--cct-success)">' + SK.glyphs.dot + '</span>'], id) + '</span>';
        const tool = (tdef, id) => '<div class="cc-t">' + dot(id) + '<span><span class="cc-tn">' + tdef.name + '</span>' + esc(tdef.args) + '</span></div>';
        const res = (html, id) => '<div class="cc-r hid"' + (id ? ' id="' + id + '"' : '') + '>' + elbow + '<span class="cc-rb">' + html + '</span></div>';
        const dl = (d, i) => {
          const cls = d.k === '+' ? 'is-add' : d.k === '-' ? 'is-rem' : 'is-ctx';
          const code = d.k === ' ' ? esc(plain(d.s)) : marked(d.s, d.k === '+' ? 'cc-w-add' : 'cc-w-rem');
          return '<span class="cc-dl ' + cls + ' hid" id="dl' + i + '"><span class="cc-ln">' + d.n + '</span><span>' + (d.k === ' ' ? ' ' : d.k) + '</span><span>' + code + '</span></span>';
        };
        const spinFrames = ['sp0', 'sp1', 'sp2', 'sp3', 'sp4', 'sp5'].map((n) => SK.glyphs[n]);

        win.innerHTML =
          '<div class="tbar">' + lights + '<span class="ttl">' + g('sp2') + '<span><span id="tt0">' + esc(C.titleIdle) + '</span><span id="tt1" class="hid">' + esc(C.titleTask) + '</span></span></span></div>' +
          '<div class="tbody"><div class="cc-term" style="--cct-fs:13px;--cct-lh:1.55"><div class="cc-cli">' +
            '<div class="cc-tx vp" data-layout-allow-overflow><div class="vpi" id="txi" style="--sy:0">' +
              '<div class="cc-l cc-hdr" data-layout-allow-occlusion>' + g('spark') + ' ' + esc(C.header) + '</div>' +
              '<div class="cc-u cc-b hid" id="ub">' + gut('chev') + '<span>' + esc(CONFIG.task) + '</span></div>' +
              '<div class="cc-b hid" id="rd">' + tool(C.read, 'rdD') + res(C.read.result + ' <span class="cc-dim" data-layout-ignore>' + esc(C.read.hint) + '</span>', 'rdR') + '</div>' +
              '<div class="cc-b hid" id="ed">' + tool(C.edit, 'edD') + res(C.edit.result, 'edR') +
                '<div class="cc-r is-cont"><span></span><span class="cc-rb cc-diff">' + CONFIG.diff.map(dl).join('') + '</span></div></div>' +
              '<div class="cc-b hid" id="bs">' + tool(C.bash, 'bsD') + res('<span class="cc-dim">' + esc(C.bash.running) + '</span>', 'bsRun') + res(esc(C.bash.result), 'bsR') + '</div>' +
              '<div class="cc-a cc-b hid" id="ans">' + gut('dot') + '<span>' + words(C.answer, 'cc-id') + '</span></div>' +
              '<div class="cc-b hid" id="spin"><div class="cc-spin"><span class="cc-gut">' + stack(spinFrames, 'spinG') + '</span><span><span class="cc-verb" id="verb" data-layout-ignore>' + esc(C.verb) +
                '</span> <span class="cc-dim" data-layout-ignore>(<span id="ctr">0s · ↓ 0 tokens</span>)</span></span></div></div>' +
              '<div class="cc-done cc-b hid" id="done">' + gut('spark') + '<span>' + esc(C.done) + '</span></div>' +
            '</div></div>' +
            '<div class="cc-input"><div class="cc-rule"></div>' +
              '<div class="cc-pline">' + gut('chev') + '<span><span id="typed"></span></span></div>' +
              '<div class="cc-rule"></div>' +
              '<div class="cc-foot"><span class="cc-mode-auto">' + g('ff') + ' ' + esc(C.mode) + '</span> <span class="cc-hint" data-layout-ignore>' + esc(C.hint) + '</span> · ' +
                '<span id="f-idle">' + g('larr') + ' ' + esc(C.idle) + '</span><span class="hid" id="f-busy">' + esc(C.busy) + '</span></div>' +
            '</div></div></div></div>';
        win.classList.add('v0', 'sk-cc');
        win.setAttribute('data-theme', theme);

        // 1. the prompt is typed after ❯ (block cursor), then Enter
        K.typeText(tl, '#typed', CONFIG.task, T.typeAt, { cps: T.cps, caretFrom: 0.3, caretUntil: T.end });
        const S = T.submit;
        hide($('#typed .km-typed'), S);
        show('#ub', S, 'grid');
        show('#spin', S);
        hide('#f-idle', S); show('#f-busy', S, 'inline');
        hide('#tt0', S + 0.5); show('#tt1', S + 0.5, 'inline');
        // spinner glyph ping-pongs · ✢ ✳ ✶ ✻ ✽, the verb shimmers, seconds tick and tokens roll every 100 ms
        cycleFrames($('#spinG'), S, T.done, 0.12, [0, 1, 2, 3, 4, 5, 4, 3, 2, 1]);
        const reps = Math.floor((T.done - S) / 1.1);
        tl.fromTo('#verb', { '--cc-shim': '100%' }, { '--cc-shim': '0%', duration: 1.1, ease: 'none', repeat: reps - 1, immediateRender: false }, S);
        const ctr = $('#ctr'), KT = C.tokens;
        const tokensAt = (s) => {
          for (let i = 1; i < KT.length; i++) if (s <= KT[i][0]) return KT[i - 1][1] + (KT[i][1] - KT[i - 1][1]) * (s - KT[i - 1][0]) / (KT[i][0] - KT[i - 1][0]);
          return KT[KT.length - 1][1];
        };
        drive(S, T.done, (t) => {
          const s = Math.max(0, t - S), q = Math.floor(s * 10 + 1e-6);
          let n = Math.round(tokensAt(q / 10));
          if (n > 0) n += ((q * 7) % 5) * 3;   // uneven 100 ms steps, still rising
          const tok = n < 1000 ? String(n) : (n / 1000).toFixed(1) + 'k';
          const txt = Math.floor(s + 1e-6) + 's · ↓ ' + tok + ' tokens';
          if (ctr.textContent !== txt) ctr.textContent = txt;
        });

        // 2. Read → Update (+ patch) → Bash: grey ● while running, green ● with its ⎿ result when done
        show('#rd', T.read[0]); blink($$('#rdD .fr')[0], T.read[0], T.read[1], 0.09);
        toFrame($('#rdD'), 0, 1, T.read[1]); show('#rdR', T.read[1], 'grid');
        show('#ed', T.edit[0]); blink($$('#edD .fr')[0], T.edit[0], T.edit[1], 0.09);
        toFrame($('#edD'), 0, 1, T.edit[1]); show('#edR', T.edit[1], 'grid');
        rows(CONFIG.diff.map((_, i) => '#dl' + i), T.edit[1] + T.row, 'grid');
        show('#bs', T.bash[0]); show('#bsRun', T.bash[0] + 0.12, 'grid'); blink($$('#bsD .fr')[0], T.bash[0], T.bash[1], 0.15);
        toFrame($('#bsD'), 0, 1, T.bash[1]); hide('#bsRun', T.bash[1]); show('#bsR', T.bash[1], 'grid');

        // 3. the reply streams in under the tools; the turn ends on "✻ Worked for 4s"
        show('#ans', T.answer, 'grid'); printChunks($('#ans'), T.answer, 0.42, 3);
        hide('#spin', T.done); show('#done', T.done, 'grid');
        hide('#f-busy', T.done); show('#f-idle', T.done, 'inline');

        autoScroll($('.v0 .cc-tx'), $('#txi'));
      }

      /* ======================= v1  Codex CLI ======================= */
      function buildCodex(C) {
        const L = (html, cls, id, hidden) => '<div class="cx-tl' + (cls ? ' ' + cls : '') + (hidden ? ' hid' : '') + '"' + (id ? ' id="' + id + '"' : '') + '>' + html + '</div>';
        const GAP = '<div class="cx-t-gap"></div>';
        const B = '<span class="cx-t-bullet">•</span> ';
        const dl = (d) => L('    ' + d.n + ' ' + d.k + esc(plain(d.s)), 'cx-t-' + (d.k === '+' ? 'add' : 'del'));
        const ans = C.answer.map((s) => s.t != null ? esc(s.t) : '<span class="cx-t-cyan">' + esc(s.code) + '</span>').join('');
        // the Ran bullet is the same text glyph as every other bullet; only its colour changes
        const runBullet = '<span class="alt on0 cx-t-bullet" id="rnB">•</span><span class="alt cx-t-green">•</span> ';
        const hid = (inner, id) => '<div class="hid" id="' + id + '">' + inner + '</div>';

        win.innerHTML =
          '<div class="tbar">' + lights + '<span class="ttl">' + esc(C.title) + '</span></div>' +
          '<div class="tbody"><div class="cx-term-body cxb">' +
            '<div class="cxtx vp" data-layout-allow-overflow><div class="vpi" id="txi" style="--sy:0">' +
              L('  <span class="cx-t-strong">&gt;_</span> <span class="cx-t-b">OpenAI Codex</span> <span class="cx-t-dim" data-layout-ignore>(' + esc(C.version) + ')</span>') +
              L('     <span class="cx-t-dim" data-layout-ignore>' + esc(C.cwd) + '</span>') + GAP +
              L('  <span class="cx-t-blue">' + esc(C.tagline) + '</span>') +
              hid(GAP + L('<span class="cx-t-b">›</span> ' + esc(CONFIG.task), 'cx-t-band'), 'ub') +
              hid(GAP + L(B + '<span class="cx-t-b">' + alts(C.explore.map(esc)) + '</span>'), 'ex0') +
              hid(L('  ' + gl('tree') + ' <span class="cx-t-cyan">Read</span> ' + esc(C.exploreItem)), 'ex1') +
              hid(GAP + L(B + '<span class="cx-t-b">Edited</span> ' + esc(C.edit.file) + ' (<span class="cx-t-green">+' + C.edit.add + '</span> <span class="cx-t-red">-' + C.edit.rem + '</span>)'), 'ed0') +
              CONFIG.diff.filter((d) => d.k !== ' ').map((d, i) => hid(dl(d), 'ed' + (i + 1))).join('') +
              hid(GAP + L(runBullet + '<span class="cx-t-b">' + alts(C.run.map(esc)) + '</span> ' + esc(C.cmd)), 'rn0') +
              hid(L('  ' + gl('tree') + ' Tests  <span class="cx-t-green">48 passed</span> (48)'), 'rn1') +
              hid(GAP + '<div class="cx-tl cx-t-rule">' + gl('hline') + '<span>' + esc(C.worked) + '</span></div>', 'wk') +
              hid(GAP + L('<span class="cx-t-bullet">•</span> ' + ans, 'is-item'), 'ans') +
            '</div></div>' +
            L(B + '<span class="cx-t-shimmer" id="shim">Working</span> <span class="cx-t-dim" data-layout-ignore>(' + alts(C.timers) + ' • esc to interrupt)</span>', '', 'status', true) +
            '<div class="cx-t-composer">' + L('<span><span class="cx-t-b">›</span> <span class="slot" id="slot" data-ph="1"><span id="typed"></span><span class="cx-t-ph" id="ph" data-layout-ignore>' +
              esc(C.placeholder) + '</span></span></span>') + '</div>' +
            '<div class="cx-t-foot">' + L('  <span class="cx-t-yellow">' + esc(C.status) + '</span>') +
              L('  <span class="cx-t-dim" data-layout-ignore>' + gl('larr') + ' for agents · <span class="cx-t-b">?</span> for shortcuts</span>') + '</div>' +
          '</div></div>';
        win.classList.add('v1', 'sk-codex');
        win.setAttribute('data-theme', theme);

        K.typeText(tl, '#typed', CONFIG.task, T.typeAt, { cps: T.cps, caretFrom: 0.3, caretUntil: T.end });
        $('#typed .km-caret').setAttribute('data-ch', C.placeholder.charAt(0));
        placeholderState($('#slot'));
        const S = T.submit;
        // Enter: the prompt lands in the history as a band; the composer empties; "Working" shimmers above it
        hide($('#typed .km-typed'), S);
        show('#ub', S);
        show('#status', S);
        const reps = Math.floor((T.answer - S) / 1.0);
        tl.fromTo('#shim', { backgroundPosition: '100% 0' }, { backgroundPosition: '0% 0', duration: 1.0, ease: 'none', repeat: reps - 1, immediateRender: false }, S);
        cycleAlt($$('#status .alt'), timerTimes());
        // cells commit row by row: Exploring → Explored, Edited with its diff, Running → Ran
        show('#ex0', T.read[0]); show('#ex1', T.read[0] + 0.12); cycleAlt($$('#ex0 .alt'), [0, T.read[1]]);
        rows(['#ed0', '#ed1', '#ed2'], T.edit[1]);
        show('#rn0', T.bash[0]); blink('#rnB', T.bash[0], T.bash[1], 0.15);
        cycleAlt($$('#rn0 .alt'), [0, T.bash[1]]); cycleAlt([$$('#rn0 .alt')[2], $$('#rn0 .alt')[3]], [0, T.bash[1]]);
        show('#rn1', T.bash[1]);
        // turn end: the Working row goes in the same frame the "Worked for" rule prints; the reply commits a beat later
        hide('#status', T.answer); show('#wk', T.answer);
        show('#ans', T.answer + 0.18);

        autoScroll($('.v1 .cxtx'), $('#txi'));
      }

      /* ======================= v2  Gemini CLI ======================= */
      function buildGemini(C) {
        const blank = '<div class="gl"></div>';
        // the logo: one rect per run of █; ░ runs are drawn under a 25% dither mask (how a terminal paints the light-shade glyph)
        const CW = 7.8, RH = 18.2;   // one mono cell at 13 px, line-height 1.4
        let solid = '', shade = '';
        C.logo.forEach((row, y) => {
          const r = row.padEnd(80, ' ');
          let x = 0;
          while (x < 80) {
            const ch = r[x];
            if (ch === ' ') { x++; continue; }
            let x2 = x; while (x2 < 80 && r[x2] === ch) x2++;
            const rect = '<rect x="' + (x * CW).toFixed(2) + '" y="' + (y * RH).toFixed(2) + '" width="' + ((x2 - x) * CW + 0.25).toFixed(2) + '" height="' + (RH + 0.35).toFixed(2) + '"/>';
            if (ch === '░') shade += rect; else solid += rect;
            x = x2;
          }
        });
        const LW = (80 * CW).toFixed(1), LH = (8 * RH).toFixed(1);
        const logo = '<svg viewBox="0 0 ' + LW + ' ' + LH + '" aria-hidden="true"><defs>' +
          '<linearGradient id="gemgrad" x1="0" y1="0" x2="' + LW + '" y2="0" gradientUnits="userSpaceOnUse">' +
          '<stop offset="0" stop-color="#4796E4"/><stop offset="0.5" stop-color="#847ACE"/><stop offset="1" stop-color="#C3677F"/></linearGradient>' +
          '<pattern id="dith" width="2.6" height="2.6" patternUnits="userSpaceOnUse"><rect width="1.3" height="1.3" fill="#fff"/></pattern>' +
          '<mask id="shademask" maskUnits="userSpaceOnUse" x="0" y="0" width="' + LW + '" height="' + LH + '"><rect width="' + LW + '" height="' + LH + '" fill="url(#dith)"/></mask></defs>' +
          '<g fill="url(#gemgrad)" mask="url(#shademask)">' + shade + '</g>' +
          '<g fill="url(#gemgrad)">' + solid + '</g></svg>';
        const tips = C.tips.map((s) => '<div class="gl">' + esc(s).replace(/\{(.+?)\}/, '<b class="gp">$1</b>') + '</div>').join('');
        const spin = (id) => stack(BRAILLE.map(brailleSVG), id);
        const status = (id) => '<span class="gst">' + stack(BRAILLE.map(brailleSVG).concat(['<span class="ok">' + GLY.hcheck + '</span>']), id) + '</span>';
        const toolRow = (t, id) => '<div class="gl">' + status(id) + '<b>' + esc(t.name) + '</b> <span class="gg">' + esc(t.desc) + '</span></div>';
        const dl = (d, i) => {
          const k = d.k === '+' ? 'add' : d.k === '-' ? 'rem' : 'ctx';
          return '<div class="gdl ' + k + ' hid" id="g' + i + '"><span class="n">' + d.n + '</span><span class="s">' + d.k + ' </span><span class="c">' +
            esc(plain(d.s)) + '</span></div>';
        };
        const ans = words(C.answer, 'gp');
        const F = C.footer;

        win.innerHTML =
          '<div class="tbar">' + lights + '<span class="ttl">' + esc(C.title) + '</span></div>' +
          '<div class="tbody"><div class="gmb"><div class="gmv vp" data-layout-allow-overflow><div class="vpi" id="txi" style="--sy:0">' +
            blank +
            '<div class="glogo">' + logo + '</div>' + blank + tips +
            '<div class="hid" id="um">' + blank + '<div class="gl"><span class="gp">&gt; </span><span class="gg">' + esc(CONFIG.task) + '</span></div>' + blank + '</div>' +
            '<div class="gbox hid" id="rdBox">' + toolRow(C.read, 'rdS') + '</div>' +
            '<div class="gbox hid" id="grp">' + toolRow(C.edit, 'edS') + CONFIG.diff.map(dl).join('') +
              '<div class="hid" id="shw">' + blank + toolRow(C.shell, 'shS') + '</div>' +
              '<div class="gl hid" id="shOut">   ' + esc(C.shell.out) + '</div></div>' +
            '<div class="hid" id="ldw">' + blank + '<div class="gl">' + '<span class="gp">' + spin('ldS') + '</span> <span class="gp">' + alts(C.phrases.map(esc)) + '</span>' +
              '<span class="gg" data-layout-ignore> (esc to cancel, ' + alts(C.timers) + ')</span></div></div>' +
            '<div class="hid" id="answ">' + blank + '<div class="gl gans">' + gl('star') + ' ' + ans + '</div></div>' +
            blank +
            '<div class="gl gsplit"><span class="gg" data-layout-ignore>' + esc(C.context) + '</span><span class="ggr">' + esc(C.mode) + '</span></div>' +
            '<div class="gin"><div class="gl"><span class="gp">&gt; </span><span class="slot" id="slot" data-ph="1"><span id="typed"></span><span class="gg" id="ph" data-layout-ignore>' + esc(C.placeholder) + '</span></span></div></div>' +
            '<div class="gl gsplit"><span><span class="glb">' + esc(F.path) + '</span><span class="gg" data-layout-ignore>' + esc(F.branch) + '</span></span>' +
              '<span class="gr">' + esc(F.sandbox) + '</span>' +
              '<span><span class="gb">' + esc(F.model) + '</span><span class="gg" id="ctx" data-layout-ignore> (' + alts(F.ctx) + ' context left)</span></span></div>' +
          '</div></div></div></div>';
        win.classList.add('v2', 'gmc');

        K.typeText(tl, '#typed', CONFIG.task, T.typeAt, { cps: T.cps, caretFrom: 0.3, caretUntil: T.end });
        placeholderState($('#slot'));
        const S = T.submit;
        // Enter: the prompt prints as "> …", the input box empties, the loading line starts
        hide($('#typed .km-typed'), S);
        show('#um', S); show('#ldw', S);
        cycleFrames($('#ldS'), S, T.answer, 0.08);
        cycleAlt($$('#ldw .gp .alt'), [0, T.edit[0], T.bash[0]]);
        cycleAlt($$('#ldw .gg .alt'), timerTimes());
        // tools: a braille spinner in the status column, then a heavy ✔
        const run = (stackId, t0, t1) => { const last = cycleFrames($('#' + stackId), t0, t1, 0.08); toFrame($('#' + stackId), last, 10, t1); };
        show('#rdBox', T.read[0]); run('rdS', T.read[0], T.read[1]);
        show('#grp', T.edit[0]); run('edS', T.edit[0], T.edit[1]);
        rows(CONFIG.diff.map((_, i) => '#g' + i), T.edit[1] + T.row, 'grid');
        show('#shw', T.bash[0]); run('shS', T.bash[0], T.bash[1]); show('#shOut', T.bash[1]);
        // the reply replaces the loading line and streams in; the footer's context figure settles
        hide('#ldw', T.answer); show('#answ', T.answer); printChunks($('#answ'), T.answer, 0.42, 3);
        cycleAlt($$('#ctx .alt'), [0, T.done]);

        // the first time the content overflows, the whole banner (blank + logo + blank + tips = 14 rows) scrolls away in one move
        const BANNER = 2 + C.logo.length + C.tips.length;
        autoScroll($('.v2 .gmv'), $('#txi'), (r) => (r > 0 ? Math.max(r, BANNER) : 0));
      }

      /* ======================= build + shared entrance / hold / exit ======================= */
      const cfg = CONFIG.variants[variant];
      if (variant === '0') buildClaude(cfg);
      else if (variant === '1') buildCodex(cfg);
      else buildGemini(cfg);

      // the window rises in (expo-out), the hold gets one slow push-in, and the last 0.4 s clears so the tile loops
      tl.fromTo('#lift', { opacity: 0, y: 28, scale: 0.985 }, { opacity: 1, y: 0, scale: 1, duration: 0.75, ease: 'expo.out', immediateRender: false }, T.enter);
      gsap.set('#lift', { opacity: 0, y: 28, scale: 0.985 });
      tl.fromTo('#lift', { scale: 1 }, { scale: 1.02, duration: T.exit - T.push, ease: 'power2.inOut', immediateRender: false }, T.push);
      tl.fromTo('#lift', { opacity: 1, y: 0 }, { opacity: 0, y: -6, duration: T.end - T.exit, ease: 'power2.in', immediateRender: false }, T.exit);
      tl.set({}, {}, T.end);

      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
