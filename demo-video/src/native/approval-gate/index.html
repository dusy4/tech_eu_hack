      const CONFIG = {

            },
            reply: "Installed `p-retry` and wrapped chunk uploads in it: 3 retries with backoff, only on network errors and 5xx. All 12 upload tests pass.",
            files: {

      };

      /* ---------------- variables ---------------- */
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
      const VARIANT = ["0", "1", "2"].includes(String(VARS.variant)) ? String(VARS.variant) : "0";

      const C = CONFIG.variants[VARIANT];
      const B = CONFIG.beat;
      const DUR = CONFIG.duration;
      const K = window.KitMotion;

      if (THEME === "dark") { document.body.classList.add("is-dark"); document.getElementById("stage").classList.add("is-dark"); }
      const place = document.getElementById("place"), zoomer = document.getElementById("zoomer"), win = document.getElementById("win");
      const SHADOW = THEME === "dark" ? "sh-dark" : "sh-light";

      /* ---------------- shared helpers ---------------- */
      const $ = (sel, r) => (r || win).querySelector(sel);
      const $$ = (sel, r) => Array.from((r || win).querySelectorAll(sel));
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
      const seg = (t, t0, d) => clamp01((t - t0) / d);
      const easeOut = K.ease("out"), easeInOut = K.ease("inOut");

      const TICK = [];
      const onTick = (fn) => TICK.push(fn);
      function fade(tl, el, from, to, at, dur, ease) {

      }
      /* box of an element in a reference element's own CSS px (independent of any zoom) */
      function boxIn(el, ref, refW) {
        const R = ref.getBoundingClientRect(), k = R.width / refW, b = el.getBoundingClientRect();
        return { x: (b.left - R.left) / k, y: (b.top - R.top) / k, w: b.width / k, h: b.height / k };
      }
      /* human typing: seeded, uneven gaps (longer on spaces), at an average cps. Returns the time each char lands. */
      function typeTimes(text, t0, cps) {
        let h = 2166136261;
        for (const ch of text) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;
        const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return (h % 10007) / 10007; };
        const iv = [], n = text.length; let sum = 0;
        for (let i = 0; i < n; i++) { let k = 0.6 + rnd() * 0.8; if (text[i] === " ") k *= 1.3; if (i && /[.,!?]/.test(text[i - 1])) k *= 2; iv.push(k); if (i) sum += k; }
        const span = (n - 1) / cps, times = [t0];
        for (let i = 1; i < n; i++) times.push(times[i - 1] + (iv[i] * span) / sum);
        return times;
      }
      const typedCount = (times, t) => { let c = 0; while (c < times.length && times[c] <= t) c++; return c; };
      /* markup is written indented for reading; drop the newline whitespace between tags
         (the terminal rows are white-space: pre-wrap, where it would print as blank rows) */
      const tidy = (html) => html.replace(/>\s*\n\s*</g, "><").trim();
      const SVG = (inner, sw) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw || 1.75}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
      const IC = {

      function animCC(tl) {
        const R = C;
        /* the person types the task; Enter at tEnter; then a fast run of work up to the gate */
        const times = typeTimes(R.prompt, B.type || 0.42, 46);
        const tEnter = times[times.length - 1] + 0.14;
        const tSum = tEnter + 0.3, tEd = tEnter + 0.46, tEdDone = B.gate - 0.17;
        const tPick = B.approve - 0.6, tBsDone = B.done - 0.15, tAns = B.done + 0.1, tDone = B.done + 0.8;
        const ans = $$("#cc-ans .cc-w");
        const chunk = 3, nChunks = Math.ceil(ans.length / chunk), ansDur = 0.55;
        $("#cc-worked").textContent = "Worked for " + Math.floor(tDone - tEnter) + "s";
        const el = {
          band: $("#cc-band"), sum: $("#cc-sum"), ed: $("#cc-ed"), edR: $("#cc-edR"), edF: $$("#cc-edT .fr"),
          bs: $("#cc-bs"), bsRun: $("#cc-bsRun"), bsRes: $("#cc-bsRes"), bsF: $$("#cc-bsT .fr"),
          ansRow: $("#cc-ans"), done: $("#cc-done"), spin: $("#cc-spin"), spinF: $$("#cc-spin .fr"),
          verb: $("#cc-verb"), count: $("#cc-count"), input: $("#cc-input"), perm: $("#cc-perm"),
          opts: $$(".cc-opt"), fEsc: $("#cc-f-esc"), fAg: $("#cc-f-agents"), cursor: $("#cc-cursor"), typed: $("#cc-typed"),
          view: $("#cc-view"), stack: $("#cc-stack")
        };
        const show = (e, on, disp) => { const v = on ? (disp || "") : "none"; if (e.style.display !== v) e.style.display = v; };
        const tokens = (t) => { const n = Math.round(180 + 640 * Math.max(0, t - tEnter)); return n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n); };
        onTick((t) => {
          const gateOpen = t >= B.gate && t < B.approve;
          const started = t >= tEnter;
          show(el.band, started);
          show(el.sum, t >= tSum);
          show(el.ed, t >= tEd);
          show(el.edR, t >= tEdDone, "grid");
          const edBlink = Math.floor((t - tEd) / 0.18) % 2 === 0 ? 1 : 0.35;
          el.edF[0].style.opacity = t < tEdDone ? edBlink : 0; el.edF[1].style.opacity = t < tEdDone ? 0 : 1;
          show(el.bs, t >= B.approve);
          show(el.bsRun, t < tBsDone, "grid"); show(el.bsRes, t >= tBsDone, "grid");
          const bsBlink = Math.floor((t - B.approve) / 0.22) % 2 === 0 ? 1 : 0.35;
          el.bsF[0].style.opacity = t < tBsDone ? bsBlink : 0; el.bsF[1].style.opacity = t < tBsDone ? 0 : 1;

          el.count.textContent = Math.floor(Math.max(0, t - tEnter)) + "s · ↓ " + tokens(t) + " tokens";

        const A = X.approval;
        win.innerHTML = tidy(`
          <div class="sk-codex cx-window" data-theme="${THEME}" style="width:${X.w}px;height:${X.h}px">
            <div class="cx-titlebar">
              <div class="cx-tb-lead">
                <div class="cx-traffic"><i></i><i></i><i></i></div>
                <span class="cx-tb-btn">${ico("arrow-left")}</span>
                <span class="cx-tb-btn is-off">${ico("arrow-right")}</span>
                <span class="cx-tb-btn">${ico("sidebar")}</span>
              </div>
              <i class="cx-tb-sep"></i>
              <div class="cx-tb-main" style="padding-left:6px">
                <span class="cx-tab is-grow">${ico("bubble")}<span>${esc(X.tab)}</span>${ico("close", "cx-tab-x")}</span>
              </div>
              <div class="cx-tb-right"><span class="cx-tb-btn">${ico("new-tab")}</span></div>
            </div>
            <div class="cx-body">
              <div class="cx-rail">
                <span class="cx-rail-btn is-active">${ico("home-fill")}</span>
                <span class="cx-rail-btn">${ico("cards")}</span>
                <span class="cx-rail-btn">${ico("clock")}</span>
                <span class="cx-rail-btn">${ico("plugins")}</span>
                <span class="cx-rail-btn">${ico("more")}</span>
                <i class="cx-rail-div"></i>
                <span class="cx-rail-btn">${ico("pr")}</span>
                <span class="cx-rail-btn">${ico("openai")}</span>
                <div class="cx-rail-foot"><span class="cx-avatar-app">${ico("openai")}</span></div>
              </div>
              <div class="cx-panel">
                <div class="cx-main">
                  <div class="cx-thread ag-thread" id="cx-thread"><div class="cx-thread-inner" id="cx-inner">
                    <div class="cx-user"><div class="cx-bubble">${esc(X.user)}</div></div>
                    <div class="cx-worked" id="cx-worked"><span id="cx-wtext"></span><span class="cx-i" id="cx-wchev" data-cx-icon="chevron-right" style="opacity:0"></span></div>
                    <div id="cx-live" style="position:relative">
                      <div class="ag-rows" id="ag-rows">${X.rows.map((r, i) => `<div class="ag-row${r.wait ? " is-wait" : ""}" id="ag-r${i}">${r.html}</div>`).join("")}</div>
                      <div class="cx-ai ag-reply" id="cx-reply"><p>${replyHTML}</p></div>
                      <div class="cx-files" id="cx-files">
                        <div class="cx-files-head">
                          <span class="cx-files-tile">${ico("diff")}</span>
                          <div><div class="cx-files-title">${esc(X.files.title)}</div><div class="cx-files-counts">${counts(X.files.plus, X.files.minus)}</div></div>
                          <span class="cx-files-undo">Undo${ico("undo")}</span>
                          <span class="cx-btn">Review</span>
                        </div>
                        ${X.files.rows.map((r) => `<div class="cx-files-row"><span class="dir">${esc(r.dir)}</span>${esc(r.name)}<span class="cnt">${counts(r.plus, r.minus)}</span></div>`).join("")}
                      </div>
                    </div>
                  </div></div>
                  <div class="cx-dock ag-dock" id="cx-dock">
                    <div class="ag-box" id="ag-box">
                      <div class="ag-layer" id="cx-cwrap">
                        <div class="cx-cwrap">
                          <div class="cx-composer">
                            <div class="cx-input"><span class="cx-placeholder">${esc(X.placeholder)}</span></div>
                            <div class="cx-cfoot">
                              <span class="cx-cbtn">${ico("plus")}</span>
                              <span class="cx-perm">${ico("gear")}Custom</span>
                              <span class="cx-grow"></span>
                              <span class="cx-model">${ico("bolt", "cx-bolt")}${esc(X.model.name)} <span class="cx-effort">${esc(X.model.effort)}</span>${ico("chevron-down", "cx-chev")}</span>
                              <span class="cx-cbtn">${ico("mic")}</span>
                              <span class="cx-send" id="cx-send" data-state="working">${ico("send", "cx-i-send")}${ico("stop", "cx-i-stop")}</span>
                            </div>
                          </div>
                        </div>
                      </div>
                      <div class="ag-layer" id="cx-apwrap" style="opacity:0">
                        <div class="cx-approval ag-card" id="cx-appr">
                          <div class="ag-q">${esc(A.q)}</div>
                          <div class="ag-why">${ico("shield")}<span>${esc(A.why)}</span></div>
                          <div class="ag-cmd">${esc(A.cmd)}</div>
                          <div class="ag-opts">
                            ${A.options.map((o, i) => `<div class="ag-opt${i === 0 ? " is-sel" : ""}" id="ag-opt${i}"><span class="k">${i + 1}</span><span>${inlineCode(o)}</span></div>`).join("")}
                          </div>
                          <div class="ag-foot"><span class="cx-btn is-blue" id="cx-submit">${esc(A.submit)}<span class="ag-key">${IC.ret}</span></span></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="ptr" id="cx-ptr">${window.SKIN_ICONS_CODEX.pointer}</div>`);
        window.SKIN_ICONS_CODEX.mount(win);
        document.querySelectorAll(window.SKIN_CODEX_DIM_SELECTOR).forEach((e) => e.setAttribute("data-layout-ignore", ""));
      }

      function animCodex(tl) {
        const X = C;
        const tFiles = 5.75;
        const box = $("#ag-box"), cwrap = $("#cx-cwrap"), apwrap = $("#cx-apwrap");
        const hC = cwrap.offsetHeight, hA = apwrap.offsetHeight;
        box.style.height = hC + "px";
        const sb = boxIn($("#cx-submit"), win, X.w);
        const o1 = boxIn($("#ag-opt0"), win, X.w);
        /* layout facts for the two scroll states */
        const thread = $("#cx-thread"), inner = $("#cx-inner"), rowsEl = $("#ag-rows");
        const cs = getComputedStyle(thread);
        const avail = thread.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        const rowsTop = rowsEl.getBoundingClientRect().top - inner.getBoundingClientRect().top;
        const k = inner.getBoundingClientRect().height / inner.offsetHeight || 1;
        const rowH = $("#ag-r0").offsetHeight;
        const gateBottom = rowsTop / k + rowH * 3;
        const gateShift = Math.max(0, gateBottom - (avail - (hA - hC)) + 4);
        const overflow = Math.max(0, inner.offsetHeight - avail + 4);

        /* composer ↔ approval request: the dock resizes and the two cross-fade in place (no empty frames) */
        tl.fromTo(box, { height: hC }, { height: hA, duration: 0.3, ease: K.easeName("out"), immediateRender: false }, B.gate);
        fade(tl, cwrap, 1, 0, B.gate, 0.15, "power1.out");
        tl.fromTo(apwrap, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: K.easeName("out"), immediateRender: false }, B.gate + 0.04);
        if (gateShift > 0) tl.fromTo(inner, { y: 0 }, { y: -gateShift, duration: 0.3, ease: K.easeName("out"), immediateRender: false }, B.gate);
        tl.fromTo(box, { height: hA }, { height: hC, duration: 0.3, ease: K.easeName("out"), immediateRender: false }, B.approve);
        fade(tl, apwrap, 1, 0, B.approve, 0.15, "power1.out");
        fade(tl, cwrap, 0, 1, B.approve + 0.04, 0.25, "power1.out");
        if (gateShift > 0) tl.fromTo(inner, { y: -gateShift }, { y: 0, duration: 0.3, ease: K.easeName("out"), immediateRender: false }, B.approve);

        /* the pointer: in from off the window, presses "1 Yes, proceed", then Submit */
        const ptr = $("#cx-ptr");
        const start = { x: X.w + 70, y: X.h + 30 };
        fade(tl, ptr, 0, 1, 2.62, 0.2, "power1.out");
        const up1 = K.cursorMoveClick(tl, ptr, { x: o1.x + o1.w * 0.34, y: o1.y + o1.h * 0.55 }, 2.62, { from: start, duration: 0.5, target: "#ag-opt0" });
        const at2 = up1 + 0.12;
        const up2 = K.cursorMoveClick(tl, ptr, { x: sb.x + sb.w * 0.64, y: sb.y + sb.h * 0.7 }, at2, { duration: Math.max(0.3, B.approve - at2 - 0.16), target: "#cx-submit" });
        K.cursorMove(tl, ptr, { x: sb.x + sb.w * 0.64 + 40, y: sb.y - 50 }, up2 + 0.12, { duration: 0.5 });
        fade(tl, ptr, 1, 0, up2 + 0.1, 0.24, "power1.in");

        /* live rows: each lands with a small rise; they clear when the turn ends */
        const rows = $$(".ag-row");
        X.rows.forEach((r, i) => {
          const at = r.at === "gate" ? B.gate : r.at;
          tl.fromTo(rows[i], { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.25, ease: K.easeName("out"), immediateRender: false }, at);
        });
        fade(tl, rowsEl, 1, 0, B.done, 0.15, "power1.out");

        /* result: the reply streams in 1–3 word chunks, then the files card, the thread scrolls */
        const ws = $$("#cx-reply .w");
        const sizes = [2, 3, 1, 2, 3, 2, 1, 3];
        let i = 0, n = 0, t = B.done + 0.12;
        while (i < ws.length) {
          const c = sizes[n % sizes.length];
          ws.slice(i, i + c).forEach((w) => tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out", immediateRender: false }, t));
          i += c; n++; t += 0.07;
        }
        if (overflow > 0) tl.fromTo(inner, { y: 0 }, { y: -overflow, duration: 0.45, ease: K.easeName("out"), immediateRender: false }, tFiles - 0.05);
        tl.fromTo("#cx-files", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: K.easeName("out"), immediateRender: false }, tFiles);

        /* status line, the swapping wait row and the send button: pure functions of time */
        const wtext = $("#cx-wtext"), wchev = $("#cx-wchev"), send = $("#cx-send");
        const waitIdx = X.rows.findIndex((r) => r.wait), waitRow = rows[waitIdx], waitR = X.rows[waitIdx];
        const secs = (tt) => X.secondsAtStart + Math.floor(tt);
        const setText = (e, s) => { if (e.textContent !== s) e.textContent = s; };
        onTick((tt) => {
          const waiting = tt >= B.gate && tt < B.approve;
          const done = tt >= B.done;
          setText(wtext, done ? "Worked for " + secs(B.done) + "s" : "Working for " + secs(tt) + "s");
          const shim = !done && !waiting;
          if (wtext.classList.contains("cx-shimmer") !== shim) wtext.classList.toggle("cx-shimmer", shim);
          wtext.style.backgroundPosition = shim ? (100 - 100 * ((tt % 1.3) / 1.3)).toFixed(2) + "% 0" : "";
          wchev.style.opacity = done ? 1 : 0;
          /* "Waiting for approval" swaps to what ran once approved (text swap: out 4px up, in from 4px below) */
          const ts = B.approve + 0.05, p = seg(tt, ts, 0.3);
          const label = tt < ts || p < 0.5 ? waitR.html : waitR.after;
          if (waitRow.textContent !== label) waitRow.textContent = label;
          waitRow.classList.toggle("is-wait", label === waitR.html);
          if (tt >= ts && tt < ts + 0.3) {
            const q = p < 0.5 ? easeInOut(p * 2) : easeInOut((p - 0.5) * 2);
            waitRow.style.opacity = (p < 0.5 ? 1 - q : q).toFixed(3);
            waitRow.style.translate = `0 ${(p < 0.5 ? -4 * q : 4 * (1 - q)).toFixed(2)}px`;
          } else { waitRow.style.translate = ""; if (tt >= ts) waitRow.style.opacity = "1"; }
          const st = tt >= tFiles ? "empty" : "working";
          if (send.getAttribute("data-state") !== st) send.setAttribute("data-state", st);
        });
      }

      /* ---------------- build, measure, animate ---------------- */
      const builders = { dots: [buildDots, animDots], "claude-code": [buildCC, animCC], codex: [buildCodex, animCodex] };
      const [build, anim] = builders[C.product];
      build();

      Promise.all([
        document.fonts.load('400 16px "Inter"'),
        document.fonts.load('500 16px "Inter"'),
        document.fonts.load('600 16px "Inter"'),
        document.fonts.load('400 16px "JetBrains Mono"'),
        document.fonts.load('700 16px "JetBrains Mono"')
      ]).catch(() => null).then(() => document.fonts.ready).then(() => {
        const tl = gsap.timeline({ paused: true });
        /* the object rises in, holds, and is fully clear by 7.9 s so the tile loops */
        tl.fromTo(place, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, B.enter);
        tl.fromTo(place, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.in", immediateRender: false }, B.exit);
        anim(tl);
        K.drive(tl, 0, DUR, (p) => { const t = p * DUR; TICK.forEach((f) => f(t)); });
        window.__timelines["main"] = tl;
        tl.seek(0);
      });
    </script>
  </body>
</html>
