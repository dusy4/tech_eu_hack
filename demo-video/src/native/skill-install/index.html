<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />

    <style>
      /* ---------- stage (DESIGN.md tokens) ---------- */
      :root { --stage: #F5F5F4; }
      body.is-dark { --stage: #0E0E0F; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--stage); }
      * { box-sizing: border-box; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--stage); font-family: "Inter", sans-serif; }
      #stage { position: absolute; inset: 0; background: var(--stage); }
      #cam { position: absolute; inset: 0; transform-origin: 960px 540px; }
      #place { position: absolute; }
      #frame { position: relative; }

      /* ==========================================================
         Shared skills surface. Each variant maps its skin tokens
         onto these --si-* properties (see .v-cc / .v-cx / .v-cg).
         Sizes are the product's own 1x CSS px; #zoomer presents
         the whole object at 1.76x. Three type tiers per frame:
         20 (title) / 16 (names, nav, header) / 14.5 (everything
         secondary; mono and chips at 13.5, the same tier).
         ========================================================== */
      .si-page { position: relative; }
      .si-hrow { display: flex; align-items: flex-start; gap: 16px; }
      .si-hcol { flex: 1; min-width: 0; }
      .si-h1 { font-size: 20px; line-height: 27px; font-weight: var(--si-w-semi); letter-spacing: -0.02em; color: var(--si-ink); }
      .si-sub { margin-top: 2px; font-size: 14.5px; line-height: 20px; color: var(--si-ink-2); font-weight: var(--si-w); }
      .si-btn { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 31px; padding: 0 12px 0 10px; border-radius: var(--si-btn-r, 8px);
        border: 1px solid var(--si-line-2); background: var(--si-btn-bg); color: var(--si-ink); font-size: 14.5px; font-weight: var(--si-w-med); white-space: nowrap; margin-top: 2px; }
      .si-btn svg { width: 15px; height: 15px; }

      .si-list { position: relative; margin-top: 18px; border-radius: var(--si-list-r, 12px); background: var(--si-card);
        box-shadow: 0 0 0 1px var(--si-line-2); overflow: hidden; }
      .si-ring { position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1.5px var(--si-ring); opacity: 0; pointer-events: none; z-index: 3; }
      .si-bar { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--si-bar); box-shadow: inset 0 -1px 0 var(--si-line); }
      .si-path { font-family: "JetBrains Mono", monospace; font-size: 13.5px; color: var(--si-ink-2); letter-spacing: 0; }
      .si-bar-label { font-size: 14.5px; color: var(--si-ink-2); font-weight: var(--si-w-med); }
      .si-fold { position: relative; width: 17px; height: 17px; flex: none; color: var(--si-ink-2); }
      .si-fold > span { position: absolute; inset: 0; display: block; }
      .si-fold svg { width: 100%; height: 100%; display: block; }
      .si-fold .is-open { color: var(--si-ring); opacity: 0; }
      .si-count { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 14.5px; color: var(--si-ink-2); font-variant-numeric: tabular-nums; }
      .si-roll { display: inline-block; height: 19px; line-height: 19px; overflow: hidden; vertical-align: top; }
      .si-roll-in { display: flex; flex-direction: column; }
      .si-roll-in > span { height: 19px; display: block; text-align: right; }

      .si-item { position: relative; }
      .si-row { position: relative; height: var(--si-row-h, 62px); display: flex; align-items: center; padding: 0 14px; }
      .si-item + .si-item > .si-row::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--si-line); z-index: 2; }
      .si-rc { position: relative; z-index: 1; flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 13px; }
      .si-tile-w { position: relative; width: var(--si-tile-s, 34px); height: var(--si-tile-s, 34px); flex: none; }
      .si-tile { position: relative; width: 100%; height: 100%; border-radius: var(--si-tile-r, 9px); background: var(--si-tile); color: var(--si-tile-ink); display: grid; place-items: center; }
      .si-tile svg { width: 18px; height: 18px; display: block; }
      .si-tile > * { grid-area: 1 / 1; }
      .si-tile-lit { color: var(--si-lit-ink); opacity: 0; display: grid; place-items: center; }
      .si-glow { position: absolute; inset: 2px; border-radius: 10px; background: var(--si-accent); filter: blur(9px); opacity: 0; }
      .si-bloom { position: absolute; inset: 0; border-radius: var(--si-tile-r, 9px); box-shadow: 0 0 0 1.5px var(--si-accent); opacity: 0; }
      .si-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .si-nm { display: flex; align-items: center; gap: 8px; }
      .si-nm b { font-size: 16px; line-height: 21px; font-weight: var(--si-w-med); color: var(--si-ink); letter-spacing: var(--si-track, -0.01em); }
      .si-tx > span { font-size: 14.5px; line-height: 19.5px; margin-top: 1px; color: var(--si-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: var(--si-w); }
      .si-chip { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--si-chip-r, 6px); background: var(--si-chip-bg); color: var(--si-chip-ink);
        font-size: 13.5px; line-height: 1; font-weight: var(--si-w-med); letter-spacing: -0.005em; opacity: 0; transform-origin: 0% 50%; }
      .si-tog { position: relative; flex: none; width: var(--si-tog-w, 32px); height: var(--si-tog-h, 19px); border-radius: 99px; background: var(--si-tog-off); }
      .si-tog.is-on { background: var(--si-tog-on); }
      .si-th { position: absolute; top: 2px; left: 2px; width: calc(var(--si-tog-h, 19px) - 4px); height: calc(var(--si-tog-h, 19px) - 4px); border-radius: 50%;
        background: var(--si-thumb); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.22), 0 0 0 0.5px rgba(0, 0, 0, 0.06); }
      .si-tog.is-on .si-th { transform: translateX(var(--si-travel, 13px)); background: var(--si-thumb-on, var(--si-thumb)); }

      /* the new row: slot opens, dashed drop target, then a neutral "just added" band */
      .si-slot { height: 0; overflow: hidden; }
      .si-band { position: absolute; inset: 0; opacity: 0; }
      .si-dash { position: absolute; inset: 7px 10px; border-radius: 9px; border: 1.5px dashed var(--si-dash); background: var(--si-dash-bg); }

      /* SKILL.md, the card that is dragged in */
      #drag { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 40; }
      .si-cardf { position: absolute; width: 348px; border-radius: 12px; background-color: var(--si-paper); overflow: hidden; color: var(--si-ink); }
      .si-edge { position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--si-paper-line); pointer-events: none; z-index: 2; }
      .si-card-in { position: relative; width: 348px; }
      .si-card-h { height: 38px; display: flex; align-items: center; gap: 7px; padding: 0 13px 0 13px; background: var(--si-paper-bar); box-shadow: inset 0 -1px 0 var(--si-line); }
      .si-card-h svg { width: 15px; height: 15px; display: block; color: var(--si-ink-2); flex: none; }
      .si-card-h .si-crumb { font-family: "JetBrains Mono", monospace; font-size: 13.5px; color: var(--si-ink-2); }
      .si-card-h b { font-family: "JetBrains Mono", monospace; font-size: 13.5px; font-weight: 600; color: var(--si-ink); margin-left: -7px; }
      .si-card-h .si-size { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 13.5px; color: var(--si-ink-2); }
      .si-code { position: relative; padding: 12px 14px 13px; font-family: "JetBrains Mono", monospace; font-size: 13.5px; line-height: 20px; white-space: pre; letter-spacing: 0; }
      .si-code .k { color: var(--si-key); }
      .si-code .v { color: var(--si-ink); }
      .si-code .d { color: var(--si-ink-2); }
      .si-code .h { color: var(--si-ink); font-weight: 600; }
      .si-code .p { color: var(--si-ink-2); }
      .si-code .fade { -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.15) 100%); mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.15) 100%); }
      /* the row the card turns into (a twin of the real row, revealed inside the card as it lands) */
      .si-ghost { position: absolute; left: 0; top: 0; opacity: 0; z-index: 1; }

      /* macOS pointer (22x30, hotspot at 3,2) */
      #cur { position: absolute; left: 0; top: 0; width: 22px; height: 30px; margin: -2px 0 0 -3px; z-index: 60; transform-origin: 3px 2px;
        filter: drop-shadow(0 1.5px 2.5px rgba(0, 0, 0, 0.35)); }
      #cur svg { width: 100%; height: 100%; display: block; }

      /* ==========================================================
         Variant 0: Claude Code desktop app, Customize > Skills
         Plain stroke icons like the app's own rows; blue checked
         controls (the app's worktree checkbox / selection blue);
         clay is spent once, on the skill that lights up.
         ========================================================== */
      .v-cc {
        --si-w: var(--ccd-w); --si-w-med: var(--ccd-w-med); --si-w-semi: var(--ccd-w-semi); --si-track: var(--ccd-track);
        --si-card: #ffffff; --si-bar: #f6f6f3;
        --si-ink: var(--ccd-text); --si-ink-2: var(--ccd-text2);
        --si-line: #ededea; --si-line-2: var(--ccd-card-line);
        --si-tile: rgba(217, 119, 87, 0); --si-tile-ink: var(--ccd-text2); --si-tile-s: 30px; --si-tile-r: 8px;
        --si-accent: var(--cc-clay); --si-lit-ink: #ffffff;
        --si-tog-on: var(--ccd-blue); --si-ring: var(--ccd-blue);
        --si-tog-off: #dddcd7; --si-thumb: #ffffff;
        --si-btn-bg: #ffffff; --si-btn-r: 7px; --si-list-r: 10px;
        --si-chip-bg: var(--ccd-chip); --si-chip-ink: var(--ccd-chip-text); --si-chip-r: 6px;
        --si-dash: rgba(47, 111, 209, 0.5); --si-dash-bg: rgba(47, 111, 209, 0.045);
        --si-paper: #ffffff; --si-paper-bar: #f8f8f5; --si-paper-line: rgba(0, 0, 0, 0.09); --si-key: #8b5a45;
      }
      [data-theme="dark"] .v-cc {
        --si-card: #1a1a1a; --si-bar: #1f1f1f;
        --si-line: #262626; --si-line-2: #2e2e2e;
        --si-tog-off: #3b3b39; --si-thumb: #f4f4f2;
        --si-btn-bg: #1a1a1a;
        --si-dash: rgba(112, 160, 236, 0.72); --si-dash-bg: rgba(61, 125, 219, 0.10);
        --si-paper: #222221; --si-paper-bar: #262625; --si-paper-line: rgba(255, 255, 255, 0.10); --si-key: #e0a58f;
      }
      .v-cc .cc-win { display: flex; flex-direction: column; }
      .v-cc .cc-head .cc-title { font-size: 16px; }
      .v-cc .cc-head .cc-badge-dot { display: inline-flex; margin-right: 8px; }
      .v-cc .cc-head .cc-badge-dot .cc-tb-i { margin-right: 0; }
      .v-cc .cc-head .cc-badge-dot::after { box-shadow: 0 0 0 1.5px var(--ccd-bg); }
      .v-cc .si-page { flex: 1; padding: 16px 34px 0; background: var(--ccd-bg); }
      .v-cc .si-tile svg { width: 18px; height: 18px; }

      /* ==========================================================
         Variant 1: Codex (ChatGPT desktop app), Skills
         ========================================================== */
      .v-cx {
        --si-w: 400; --si-w-med: 500; --si-w-semi: 600; --si-track: -0.006em;
        --si-card: #ffffff; --si-bar: #fafafa;
        --si-ink: var(--cx-ink); --si-ink-2: var(--cx-ink-2);
        --si-line: rgba(0, 0, 0, 0.065); --si-line-2: rgba(0, 0, 0, 0.1);
        --si-tile: #f2f2f2; --si-tile-ink: #4a4a4a;
        --si-accent: var(--cx-blue); --si-lit-ink: #ffffff;
        --si-tog-on: var(--cx-blue); --si-ring: var(--cx-blue);
        --si-tog-off: #e2e2e2; --si-thumb: #ffffff; --si-tog-w: 30px; --si-tog-h: 18px; --si-travel: 12px;
        --si-btn-bg: #ffffff; --si-btn-r: 9px; --si-list-r: 14px;
        --si-chip-bg: rgba(58, 134, 247, 0.11); --si-chip-ink: #1f5fc4; --si-chip-r: 999px;
        --si-dash: rgba(58, 134, 247, 0.55); --si-dash-bg: rgba(58, 134, 247, 0.05);
        --si-paper: #ffffff; --si-paper-bar: #fafafa; --si-paper-line: rgba(0, 0, 0, 0.09); --si-key: #2a62a3;
      }
      [data-theme="dark"] .v-cx {
        --si-card: #1d1d1d; --si-bar: #212121;
        --si-line: rgba(255, 255, 255, 0.07); --si-line-2: rgba(255, 255, 255, 0.1);
        --si-tile: #2b2b2b; --si-tile-ink: #c4c4c4;
        --si-tog-off: #3d3d3d; --si-thumb: #f2f2f2;
        --si-btn-bg: #1d1d1d;
        --si-chip-bg: rgba(64, 128, 230, 0.18); --si-chip-ink: #8ab8ff;
        --si-dash: rgba(80, 140, 230, 0.65); --si-dash-bg: rgba(49, 113, 208, 0.10);
        --si-paper: #242424; --si-paper-bar: #282828; --si-paper-line: rgba(255, 255, 255, 0.10); --si-key: #82b4ff;
      }
      .v-cx .cx-panel { flex-direction: column; }
      .v-cx .si-page { flex: 1; padding: 22px 34px 0; }
      .v-cx .cx-rail { gap: 4px; }
      .v-cx .cx-rail-btn { width: 38px; height: 38px; }
      .v-cx .cx-rail-btn .cx-i { width: 21px; height: 21px; }
      .v-cx .cx-rail-dot { top: 5px; right: 5px; box-shadow: 0 0 0 1.5px var(--cx-chrome); }
      .v-cx .cx-rail-foot { margin-bottom: 10px; }
      .v-cx .si-btn.cx-btn { height: 31px; padding: 0 14px 0 11px; border: 0; font-size: 14.5px; gap: 6px; margin-top: 2px; }
      .v-cx .si-btn.cx-btn .cx-i { width: 15px; height: 15px; }

      /* ==========================================================
         Variant 2: ChatGPT Settings > Skills (dialog)
         ========================================================== */
      .v-cg {
        --si-w: 400; --si-w-med: 500; --si-w-semi: 600; --si-track: -0.006em;
        --si-card: #ffffff; --si-bar: #f9f9f9;
        --si-ink: var(--cg-text); --si-ink-2: var(--cg-text-2);
        --si-line: rgba(0, 0, 0, 0.065); --si-line-2: rgba(0, 0, 0, 0.1);
        --si-tile: #f3f3f3; --si-tile-ink: #4d4d4d;
        --si-accent: var(--cg-btn); --si-lit-ink: var(--cg-btn-ink);
        --si-tog-on: var(--cg-btn); --si-ring: var(--cg-text);
        --si-tog-off: #e3e3e3; --si-thumb: #ffffff; --si-tog-h: 20px; --si-tog-w: 34px; --si-travel: 14px;
        --si-btn-bg: #ffffff; --si-btn-r: 99px; --si-list-r: 14px;
        --si-chip-bg: #f0f0f0; --si-chip-ink: #5d5d5d; --si-chip-r: 999px;
        --si-dash: rgba(13, 13, 13, 0.32); --si-dash-bg: rgba(13, 13, 13, 0.025);
        --si-paper: #ffffff; --si-paper-bar: #f9f9f9; --si-paper-line: rgba(0, 0, 0, 0.09); --si-key: #5d5d5d;
      }
      [data-theme="dark"] .v-cg {
        --si-card: #212121; --si-bar: #262626;
        --si-line: rgba(255, 255, 255, 0.07); --si-line-2: rgba(255, 255, 255, 0.1);
        --si-tile: #303030; --si-tile-ink: #d0d0d0;
        --si-tog-off: #4a4a4a; --si-thumb: #f2f2f2; --si-thumb-on: #212121;
        --si-btn-bg: #212121;
        --si-chip-bg: #383838; --si-chip-ink: #c4c4c4;
        --si-dash: rgba(242, 242, 242, 0.35); --si-dash-bg: rgba(242, 242, 242, 0.04);
        --si-paper: #2c2c2c; --si-paper-bar: #303030; --si-paper-line: rgba(255, 255, 255, 0.10); --si-key: #b4b4b4;
      }
      .cgs { position: relative; display: flex; border-radius: 18px; overflow: hidden; background: #ffffff; color: var(--cg-text); font-family: var(--cg-font); }
      [data-theme="dark"] .cgs { background: #212121; }
      .cgs-nav { width: 190px; flex: none; padding: 10px 8px; background: #f9f9f9; box-shadow: inset -1px 0 0 rgba(0, 0, 0, 0.06); }
      [data-theme="dark"] .cgs-nav { background: #1b1b1b; box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.06); }
      .cgs-x { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--cg-text-2); margin: 0 0 6px 2px; }
      .cgs-x .cg-i { width: 20px; height: 20px; }
      .cgs-item { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 9px; font-size: 16px; color: var(--cg-text); letter-spacing: -0.006em; white-space: nowrap; }
      .cgs-item .cg-i { width: 18px; height: 18px; color: var(--cg-text); flex: none; }
      .cgs-item.is-on { background: #ececec; font-weight: 500; }
      [data-theme="dark"] .cgs-item.is-on { background: #363636; }
      .cgs-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .cgs-head { height: 58px; flex: none; display: flex; align-items: center; margin: 0 28px; box-shadow: inset 0 -1px 0 var(--si-line); font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
      .v-cg .si-page { flex: 1; padding: 16px 28px 0; }
      .v-cg .si-hrow { align-items: center; }
      .v-cg .si-sub { margin-top: 0; }
      .v-cg .si-list { margin-top: 16px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.6" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="6.6" data-track-index="0">
        <div id="cam">
          <div id="place">
            <div id="zoomer">
              <div id="frame"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* ==================================================================
         CONFIG: all content for the three variants
         ================================================================== */
      const CONFIG = {
        "0": {
          product: "Claude Code",
          skin: "cc", w: 700, h: 454, zoom: 1.76,
          head: "Customize",
          title: "Skills",
          sub: "Folders of instructions Claude loads when a task needs them.",
          button: "Upload skill", buttonIcon: "upload",
          folder: "tech_eu_hack/.claude/skills", folderMono: true,
          count: [16, 17], countWord: "skills",
          chip: "New",
          rows: [
            { name: "index-repo", desc: "Index a repo and start the repo-analysis MCP server", icon: "download" },
            { name: "repo-analysis", desc: "Answer code questions with the code-graph tools", icon: "doc" },
            { name: "update-ilograph", desc: "Update ilograph.yaml to match the codebase", icon: "layout" }
          ],
          insertAt: 2,
          skill: {
            name: "spelunk-handoff", desc: "Pick up and carry out decisions accepted in Spelunk", icon: "tag",
            size: "2.4 KB",
            code: [
              [["d", "---"]],
              [["k", "name: "], ["v", "spelunk-handoff"]],
              [["k", "description: "], ["v", "Pick up and carry"]],
              [["v", "  out decisions accepted in Spelunk."]],
              [["d", "---"]],
              [["h", "# Acting on a Spelunk handoff"]],
              [["p", "list_handoffs, get_handoff, build, done"]]
            ]
          }
        },
        "1": {
          product: "Codex",
          skin: "cx", w: 706, h: 456, zoom: 1.76,
          title: "Skills",
          sub: "Instructions and scripts Codex loads when a task matches.",
          button: "New skill", buttonIcon: "plus",
          folder: "~/.codex/skills", folderMono: true,
          count: [3, 4], countWord: "skills",
          chip: "New",
          rows: [
            { name: "doc", desc: "Read and edit .docx files, formatting intact", icon: "doc" },
            { name: "skill-installer", desc: "Install curated skills from openai/skills", icon: "download" },
            { name: "vercel-deploy", desc: "Deploy the current project to Vercel", icon: "vercel" }
          ],
          insertAt: 1,
          skill: {
            name: "gh-fix-ci", desc: "Fix failing GitHub Actions checks on a PR", icon: "github",
            size: "2.1 KB",
            code: [
              [["d", "---"]],
              [["k", "name: "], ["v", "gh-fix-ci"]],
              [["k", "description: "], ["v", "Fix failing GitHub"]],
              [["v", "  Actions checks on the open PR."]],
              [["d", "---"]],
              [["h", "# Fix failing CI"]],
              [["p", "Run gh pr checks, read the failing log"]]
            ]
          }
        },
        "2": {
          product: "ChatGPT",

        tl.fromTo(card, { x: 0, y: 0, width: cardW, height: cardH, borderRadius: 12 },
          { x: rowB.x - dropPt.x + grab.x, y: rowB.y - dropPt.y + grab.y, width: rowB.w, height: rowB.h, borderRadius: 0, duration: 0.34, ease: "power3.out", immediateRender: false }, m);
        tl.fromTo(card, { backgroundColor: css("--si-paper") }, { backgroundColor: band, duration: 0.22, ease: "power1.inOut", immediateRender: false }, m);
        tl.fromTo(card, { boxShadow: contact }, { boxShadow: flat, duration: 0.26, ease: "power1.out", immediateRender: false }, m + 0.08);
        tl.fromTo("#cardEdge", { opacity: 1 }, { opacity: 0, duration: 0.24, ease: "power1.out", immediateRender: false }, m + 0.1);
        // contents cross: the file text leaves first, the row it becomes resolves at the end
        tl.fromTo("#cardIn", { opacity: 1 }, { opacity: 0, duration: 0.09, ease: "power1.out", immediateRender: false }, m);
        tl.fromTo(ghost, { opacity: 0 }, { opacity: 1, duration: 0.13, ease: "power1.out", immediateRender: false }, m + 0.08);
        tl.fromTo("#dash", { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power1.out", immediateRender: false }, m + 0.02);
        tl.fromTo("#ring", { opacity: 0.6 }, { opacity: 0, duration: 0.3, ease: "power1.out", immediateRender: false }, m + 0.1);
        // swap to the real row (identical pixels: same band, same content)
        const s = T.swap;
        tl.fromTo("#band", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, s);
        tl.fromTo("#newRc", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, s);
        tl.fromTo(card, { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none", immediateRender: false }, s + 0.01);
        tl.fromTo("#foldO", { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.inOut", immediateRender: false }, s + 0.02);
        tl.fromTo("#foldC", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.inOut", immediateRender: false }, s + 0.02);
        tl.fromTo("#roll", { yPercent: 0 }, { yPercent: -50, duration: 0.34, ease: "power2.inOut", immediateRender: false }, s + 0.04);

        /* ---- switch it on: the new ability lights up ---- */
        const togPt = { x: togB.x + togB.w * 0.62, y: togB.y + togB.h * 0.55 };
        const tClick = K.cursorMoveClick(tl, cur, togPt, s + 0.12, { from: { x: dropPt.x, y: dropPt.y }, target: "#tog" });
        const travel = parseFloat(css("--si-travel")) || 13;
        K.toggle(tl, "#th", tClick, { on: true, travel: travel, track: "#tog", onColor: togOn, offColor: togOff });
        const thumbOn = css("--si-thumb-on");
        if (thumbOn) tl.fromTo("#th", { backgroundColor: css("--si-thumb") }, { backgroundColor: thumbOn, duration: 0.2, ease: "power1.out", immediateRender: false }, tClick + 0.05);
        const tLit = tClick + 0.04;
        tl.fromTo("#tile", { backgroundColor: tileBg }, { backgroundColor: accent, duration: 0.26, ease: EOUT, immediateRender: false }, tLit);
        tl.fromTo("#tileBase", { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power1.out", immediateRender: false }, tLit);
        tl.fromTo("#tileLit", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out", immediateRender: false }, tLit + 0.04);
        // stroke glyphs draw on in the lit colour; filled logos just turn
        frame.querySelectorAll("#tileLit path, #tileLit circle, #tileLit rect").forEach((p) => {
          if (p.closest("svg").getAttribute("fill") === "currentColor") return;
          const len = Math.ceil(p.getTotalLength()) + 1;
          p.style.strokeDasharray = String(len);
          tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.5, ease: EOUT, immediateRender: false }, tLit + 0.04);
        });
        tl.fromTo("#tile", { scale: 1 }, { scale: 1.08, duration: 0.16, ease: "power2.out", immediateRender: false }, tLit);
        tl.fromTo("#tile", { scale: 1.08 }, { scale: 1, duration: 0.34, ease: EOUT, immediateRender: false }, tLit + 0.16);
        tl.fromTo("#bloom", { opacity: 0.6, scale: 1 }, { opacity: 0, scale: 1.65, duration: 0.75, ease: EOUT, immediateRender: false }, tLit + 0.04);
        const soft = C.skin === "cg" && !isDark;
        const glowPeak = soft ? 0.3 : 0.6, glowRest = soft ? 0.14 : 0.3;
        tl.fromTo("#glow", { opacity: 0 }, { opacity: glowPeak, duration: 0.3, ease: EOUT, immediateRender: false }, tLit + 0.02);
        tl.fromTo("#glow", { opacity: glowPeak }, { opacity: glowRest, duration: 1.1, ease: "power1.inOut", immediateRender: false }, tLit + 0.34);

        // pointer steps away and fades
        K.cursorMove(tl, cur, { x: togPt.x + 40, y: togPt.y + 58 }, tClick + 0.3, { duration: 0.55 });
        tl.fromTo(cur, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, tClick + 0.52);

        // "New" chip pops in beside the name; the arrival band settles back to the list colour
        tl.fromTo("#chip", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.34, ease: EPOP, immediateRender: false }, tLit + 0.5);
        tl.fromTo("#band", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power1.inOut", immediateRender: false }, tLit + 0.85);

        /* ---- one slow push-in, then clear for the loop ---- */
        tl.fromTo("#cam", { scale: 1 }, { scale: 1.03, duration: T.end, ease: "none", immediateRender: false }, 0);
        tl.fromTo(place, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power1.in", immediateRender: false }, T.out);
        tl.to({}, { duration: 0.01 }, T.end - 0.01);

        // initial state (after the kit primed its elements)
        gsap.set([drag, cur], { x: start.x, y: start.y });
        gsap.set(cur, { scale: 0.9 });
        gsap.set(card, { rotation: 3, scale: 1.025 });
        gsap.set(["#dash", "#newRc"], { opacity: 0 });
        return { tClick, tLit, hero: tLit + 1.6 };
      }

      /* ---------------- layout-audit hints ---------------- */
      // the dragged card and the pointer pass over the page on purpose
      frame.querySelectorAll("#drag, #drag *, #cur").forEach((el) => { el.setAttribute("data-layout-allow-overlap", ""); el.setAttribute("data-layout-allow-occlusion", ""); el.setAttribute("data-layout-allow-overflow", ""); });
      // the page under the card is covered on purpose while the card is dragged over it
      frame.querySelectorAll(".si-page, .si-page *").forEach((el) => el.setAttribute("data-layout-allow-occlusion", ""));
      $("#roll").setAttribute("data-layout-allow-overflow", "");

      const fontsReady = Promise.all([
        document.fonts.load('400 16px "Inter"'), document.fonts.load('500 16px "Inter"'), document.fonts.load('600 16px "Inter"'),
        document.fonts.load('400 12px "JetBrains Mono"'), document.fonts.load('600 12px "JetBrains Mono"')
      ]).then(() => document.fonts.ready).catch(() => null);

      fontsReady.then(() => {
        const tl = gsap.timeline({ paused: true });
        window.__siTimes = anim(tl);
        window.__timelines["main"] = tl;
        tl.seek(0);
      });
    </script>
  </body>
</html>
