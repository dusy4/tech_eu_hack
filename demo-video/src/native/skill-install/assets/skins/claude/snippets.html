<!doctype html>
<!--
  Claude skin: canonical snippets.
  Open this file in a browser to see every piece in light and dark.
  Copy the markup between the "SNIPPET" comments into a component.

  In a component:
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <link rel="stylesheet" href="assets/skins/claude/skin.css">
    <script src="assets/skins/claude/icons.js"></script>
    ... markup inside <div class="sk-claude" data-theme="light|dark"> ...
    <script> SKIN_CLAUDE.mountIcons(document); </script>   // fills every [data-icon]

  Every size is real-app CSS px. Scale with `zoom` on a wrapper. The demo uses 2.0 (UI text ~29-32px,
  prose ~33px on a 1080p frame, the density of Anthropic's own zoomed launch renders).
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Claude skin snippets</title>
<link rel="stylesheet" href="../../_shared/fonts/fonts.css" />
<link rel="stylesheet" href="../../fonts/fonts.css" />
<link rel="stylesheet" href="skin.css" />
<script src="icons.js"></script>
<style>
  body { margin: 0; background: #e9e9e7; font-family: Inter, sans-serif; }
  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .cell { padding: 28px; position: relative; }
  .cell.light { background: #f5f5f4; }
  .cell.dark { background: #0e0e0f; }
  .label { font: 500 12px Inter, sans-serif; color: #888; margin: 0 0 12px; letter-spacing: .02em; text-transform: uppercase; }
  .row { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .surface { background: var(--ck-page); border-radius: 12px; padding: 24px; position: relative; }
  .static-menu { position: static !important; }
</style>
</head>
<body>
<div class="gallery" id="gallery"></div>

<!-- ====================================================================== -->
<!-- Each <template> is one snippet. The gallery script renders it twice.   -->
<!-- ====================================================================== -->

<!-- SNIPPET: window + sidebar (desktop app, Chat tab, Oct 2026) ============ -->
<template data-label="Window chrome + sidebar" data-zoom="0.62">
  <div class="cl-window" style="width: 1100px; height: 640px">
    <aside class="cl-sidebar">
      <div class="cl-sb-top">
        <div class="cl-traffic"><span></span><span></span><span></span></div>
        <span class="cl-iconbtn"><i class="cl-ic" data-icon="sidebar"></i></span>
        <span class="cl-iconbtn"><i class="cl-ic" data-icon="search"></i></span>
        <!-- OPTIONAL desktop Chat | Code switch (seen in the Code-tab frame):
        <div class="cl-modeswitch"><span class="is-on"><i class="cl-ic" data-icon="chat"></i></span><span><i class="cl-ic" data-icon="code"></i></span></div> -->
      </div>
      <nav class="cl-sb-nav">
        <div class="cl-sb-item"><span class="cl-newcircle"><i class="cl-ic" data-icon="plus"></i></span>New</div>
        <div class="cl-sb-item"><i class="cl-ic" data-icon="artifacts"></i>Artifacts</div>
        <div class="cl-sb-item"><i class="cl-ic" data-icon="customize"></i>Customize</div>
        <div class="cl-sb-item is-muted"><i class="cl-ic" data-icon="chevronDown"></i>More</div>
      </nav>
      <div class="cl-sb-section">
        <div class="cl-sb-heading">Recents <i class="cl-ic" data-icon="filter"></i></div>
        <div class="cl-sb-item cl-sb-recent is-selected"><i class="cl-ic" data-icon="bullet"></i><span class="cl-sb-label-text">August report totals</span></div>
        <div class="cl-sb-item cl-sb-recent"><i class="cl-ic" data-icon="bullet"></i><span class="cl-sb-label-text">Invoice rounding</span></div>
        <div class="cl-sb-item cl-sb-recent"><i class="cl-ic" data-icon="bullet"></i><span class="cl-sb-label-text">Summarize the July changelog</span></div>
      </div>
      <div class="cl-sb-spacer"></div>
      <div class="cl-sb-foot">
        <span class="cl-avatar">JO</span>
        <span>James Okafor <span class="cl-org">· Silvern Capital</span></span>
        <i class="cl-ic" data-icon="chevronDown"></i>
        <span class="cl-sb-foot-end"><i class="cl-ic" data-icon="bug"></i></span>
      </div>
    </aside>
    <main class="cl-main">
      <!-- topbar: chat title (+ optional project tag) and session icons -->
      <div class="cl-topbar">
        <span class="cl-title">August report totals</span><span class="cl-tag">billing</span>
        <span class="cl-topbar-end">
          <span class="cl-iconbtn"><i class="cl-ic" data-icon="terminal"></i></span>
          <span class="cl-iconbtn"><i class="cl-ic" data-icon="diffBox"></i></span>
          <span class="cl-iconbtn"><i class="cl-ic" data-icon="globe"></i></span>
          <span class="cl-iconbtn"><i class="cl-ic" data-icon="dotsVertical"></i></span>
        </span>
      </div>
      <div class="cl-scroll"><div class="cl-thread">
        <div class="cl-steps is-ink">Initialized session <i class="cl-ic" data-icon="chevronRight"></i></div>
        <div class="cl-msg-user" style="margin-top: 14px"><div class="cl-bubble">Sum the totals in reports/august.csv by region</div></div>
        <div class="cl-steps is-ink">Read august.csv, ran a command <i class="cl-ic" data-icon="chevronRight"></i></div>
        <!-- agentic sessions render the reply in sans: .cl-prose.is-sans -->
        <div class="cl-msg-ai"><div class="cl-prose is-sans"><p>Three regions in August. North 42,180.00, South 37,955.50, West 51,020.25. Grand total 131,155.75.</p></div></div>
        <span class="cl-spark cl-tail-spark" data-icon="spark"></span>
      </div></div>
      <div class="cl-composer-wrap">
        <div class="cl-composer is-reply"><div class="cl-input is-placeholder"></div><span class="cl-return"><i class="cl-ic" data-icon="returnKey"></i></span></div>
        <div class="cl-controls">
          <span class="cl-ctl is-iconic"><i class="cl-ic" data-icon="plus"></i></span>
          <span class="cl-ctl is-iconic"><i class="cl-ic" data-icon="mic"></i></span>
          <span class="cl-ctl is-chev"><i class="cl-ic" data-icon="chevronDown"></i></span>
          <span class="cl-grow"></span>
          <span class="cl-model"><span class="cl-model-name">Opus 5.5</span><span class="cl-effort">Medium</span></span>
          <span class="cl-auto">Auto</span>
        </div>
      </div>
    </main>
  </div>
</template>

<!-- SNIPPET: collapsed sidebar topbar (traffic lights + nav move into the main topbar) -->

<!-- SNIPPET: compact window, sidebar collapsed (what the demo shows at zoom 2: 640x440 -> 1280x880) -->

  <div class="cl-window" style="width: 640px; height: 440px">
    <main class="cl-main">
      <div class="cl-topbar is-collapsed">
        <div class="cl-traffic"><span></span><span></span><span></span></div>
        <span class="cl-iconbtn"><i class="cl-ic" data-icon="sidebar"></i></span>
        <span class="cl-iconbtn"><i class="cl-ic" data-icon="arrowLeft"></i></span>

        <span class="cl-topbar-end"><span class="cl-iconbtn"><i class="cl-ic" data-icon="openWindow"></i></span></span>
      </div>
      <div class="cl-scroll"><div class="cl-thread">
        <div class="cl-msg-user"><div class="cl-bubble">What moved our Q3 churn? Keep it short.</div></div>
        <!-- chat replies are serif with no step line (dash). Agentic sessions use the step line + sans prose (session). -->
        <div class="cl-msg-ai"><div class="cl-prose"><p>Churn fell from 4.1% to 3.2% this quarter, and almost all of the drop came from annual plans. Monthly churn barely moved.</p></div></div>

          <span class="cl-iconbtn"><i class="cl-ic" data-icon="copy"></i></span>
          <span class="cl-iconbtn"><i class="cl-ic" data-icon="speaker"></i></span>
          <span class="cl-iconbtn"><i class="cl-ic" data-icon="thumbsUp"></i></span>
          <span class="cl-iconbtn"><i class="cl-ic" data-icon="thumbsDown"></i></span>
          <span class="cl-iconbtn"><i class="cl-ic" data-icon="retry"></i></span>
        </div>
      </div></div>
      <div class="cl-composer-wrap">
        <div class="cl-composer is-reply"><div class="cl-input is-placeholder">Reply</div><span class="cl-return"><i class="cl-ic" data-icon="returnKey"></i></span></div>
        <div class="cl-controls">
          <span class="cl-ctl is-iconic"><i class="cl-ic" data-icon="plus"></i></span>
          <span class="cl-ctl is-iconic"><i class="cl-ic" data-icon="mic"></i></span>
          <span class="cl-ctl is-chev"><i class="cl-ic" data-icon="chevronDown"></i></span>
          <span class="cl-grow"></span>
          <span class="cl-model"><span class="cl-model-name">Opus 5.5</span><span class="cl-effort">Medium</span></span>
          <span class="cl-auto">Auto</span>
        </div>
      </div>
    </main>
  </div>
</template>

<!-- SNIPPET: home / empty state, composer IDLE ==============================
     The official home renders are windowless: greeting + composer on the warm canvas (--ck-page-home).
     .cl-home-inner is 560px wide (home frame: composer ~34x the 16px body text). -->
<template data-label="Home: greeting + composer idle">
  <div class="surface" style="background: var(--ck-page-home); width: 650px; padding: 40px 44px 36px">
    <h1 class="cl-greeting"><span class="cl-spark" data-icon="spark"></span>Good morning, Frankie</h1>
    <div class="cl-composer is-home">
      <div class="cl-input is-placeholder">How can I help you today?</div>
      <div class="cl-composer-bar">
        <span class="cl-iconbtn"><i class="cl-ic" data-icon="plus"></i></span>
        <span class="cl-grow"></span>
        <span class="cl-iconbtn"><i class="cl-ic" data-icon="mic"></i></span>
        <span class="cl-iconbtn"><i class="cl-ic" data-icon="waveform"></i></span>
        <span class="cl-chev"><i class="cl-ic" data-icon="chevronDown"></i></span>
      </div>
    </div>
    <!-- control row sits OUTSIDE, under the box -->
    <div class="cl-controls is-home">
      <span class="cl-ctl">Project or folder <i class="cl-ic" data-icon="chevronDown"></i></span>
      <span class="cl-ctl">Output <i class="cl-ic" data-icon="chevronDown"></i></span>
      <span class="cl-grow"></span>
      <span class="cl-model"><span class="cl-model-name">Opus 5.5</span><span class="cl-effort">High</span></span>
      <span class="cl-auto">Auto</span>
    </div>
  </div>
</template>

<!-- SNIPPET: composer TYPING (attachment + text + clay send) ================
     .is-focus darkens the hairline while typing (closeup #c7c7c7); .is-hover is the darker pointer-over edge. -->
<template data-label="Composer typing: attachment, Output chip, send">
  <div class="surface" style="background: var(--ck-page-home); width: 745px; padding: 32px 44px">
    <div class="cl-composer is-home is-focus">
      <div class="cl-attachments">
        <div class="cl-attach"><div class="cl-attach-name">New Recording 14.txt</div><div class="cl-attach-meta">38 lines</div><span class="cl-attach-kind">TXT</span></div>
      </div>
      <div class="cl-input">turn my exact words into a presentation using claude slides, but organize them in a way that makes se<span class="cl-caret"></span></div>
      <div class="cl-composer-bar">
        <span class="cl-iconbtn"><i class="cl-ic" data-icon="plus"></i></span>
        <span class="cl-grow"></span>
        <span class="cl-send"><i class="cl-ic" data-icon="send"></i></span>
      </div>
    </div>
    <div class="cl-controls is-home">
      <span class="cl-ctl">Project or folder <i class="cl-ic" data-icon="chevronDown"></i></span>
      <!-- an Output chip takes its menu tile's colour: Slides (official) / .is-docs / .is-design (extrapolated) -->
      <span class="cl-chip-output">Slides <i class="cl-ic" data-icon="close"></i></span>
      <span class="cl-ctl"><i class="cl-ic is-lead" data-icon="design"></i>Claude Design System</span>
      <span class="cl-grow"></span>
      <span class="cl-model"><span class="cl-model-name">Sonnet 5.5</span><span class="cl-effort">Medium</span></span>
      <span class="cl-auto">Auto</span>
    </div>
  </div>
</template>

<!-- SNIPPET: conversation composer: idle (⏎), working (context ring), typed (send) -->
<template data-label="Reply composer: idle / working / typed">
  <div class="surface" style="width: 640px; display: flex; flex-direction: column; gap: 22px">
    <div>
      <div class="cl-composer is-reply"><div class="cl-input is-placeholder">Reply</div><span class="cl-return"><i class="cl-ic" data-icon="returnKey"></i></span></div>
      <div class="cl-controls">
        <span class="cl-ctl is-iconic"><i class="cl-ic" data-icon="plus"></i></span>
        <span class="cl-ctl is-iconic"><i class="cl-ic" data-icon="mic"></i></span>
        <span class="cl-ctl is-chev"><i class="cl-ic" data-icon="chevronDown"></i></span>
        <span class="cl-grow"></span>
        <span class="cl-model"><span class="cl-model-name">Opus 5.5</span><span class="cl-effort">Medium</span></span>
        <span class="cl-auto">Auto</span>
      </div>
    </div>
    <div>
      <!-- working: no official frame shows a stop button. The box keeps its ⏎ glyph and the row ends in the
           context ring (grey track, blue arc filling from 12 o'clock; picker-sep + session). Fill it with
           SKIN_CLAUDE.ringFill(tl, ringEl, from, to, at, dur). The pulsing spark in the thread says "working". -->
      <div class="cl-composer is-reply"><div class="cl-input is-placeholder">Reply</div><span class="cl-return"><i class="cl-ic" data-icon="returnKey"></i></span></div>
      <div class="cl-controls">
        <span class="cl-ctl is-iconic"><i class="cl-ic" data-icon="plus"></i></span>
        <span class="cl-ctl is-iconic"><i class="cl-ic" data-icon="mic"></i></span>
        <span class="cl-ctl is-chev"><i class="cl-ic" data-icon="chevronDown"></i></span>
        <span class="cl-grow"></span>
        <span class="cl-model"><span class="cl-model-name">Opus 5.5</span><span class="cl-effort">Medium</span></span>
        <span class="cl-auto">Auto</span>
        <span class="cl-ring" data-icon="ring"></span>
      </div>
    </div>
    <div>
      <!-- typed reply: clay send replaces the return glyph -->
      <div class="cl-composer is-reply"><div class="cl-input">Add speaker notes too</div><span class="cl-send"><i class="cl-ic" data-icon="send"></i></span></div>
    </div>
  </div>
</template>

<!-- SNIPPET: model picker OPEN (anchored above the model label) ============= -->
<template data-label="Model picker open">
  <div class="surface" style="width: 420px; height: 330px; display: flex; flex-direction: column; justify-content: flex-end">
    <div class="cl-controls">
      <span class="cl-grow"></span>
      <span class="cl-model" style="position: relative">
        <span class="cl-model-name is-open">Opus 5.5</span><span class="cl-effort">Medium</span>
        <!-- right edge sits just past the label; the list opens upward from the label.
             For a highlight that follows the pointer, add <span class="cl-menu-hl"></span> as the
             first child and move its `top` (the demo does this). The current model is highlighted on open.
             The picker's right edge lines up with the label's grey pill (picker-sep). -->
        <div class="cl-menu cl-picker" style="bottom: calc(100% + 9px); right: -5px">
          <div class="cl-menu-head">Models</div>
          <!-- Oct 5 list. The blue check (checkBold) replaces the current model's digit. -->
          <div class="cl-menu-item is-hover">Opus 5.5<span class="cl-end"><span class="cl-check"><i class="cl-ic" data-icon="checkBold"></i></span></span></div>
          <div class="cl-menu-item">Fable 5.1<span class="cl-end"><span class="cl-kbd">2</span></span></div>
          <div class="cl-menu-item">Sonnet 5.5<span class="cl-end"><span class="cl-kbd">3</span></span></div>
          <div class="cl-menu-item">Haiku 4.5<span class="cl-end"><span class="cl-kbd">4</span></span></div>
          <div class="cl-menu-sep"></div>
          <div class="cl-menu-item is-more">More models<span class="cl-end"><i class="cl-ic" data-icon="chevronRight"></i></span></div>
        </div>
      </span>
      <span class="cl-auto">Auto</span>
      <span class="cl-ring" data-icon="ring"></span>
    </div>
  </div>
</template>

<!-- SNIPPET: pointers (white fill, black outline, as in Anthropic's renders) -->
<template data-label="Pointer: arrow (menus) / hand (model control)">
  <div class="surface" style="width: 240px; height: 110px">
    <!-- absolutely positioned in a positioned ancestor; SKIN_CLAUDE.pointerAt / pointerTo take the TIP position.
         Arrow over menus (home frame); .is-hand + data-icon="hand" over the model control (picker-sep, session). -->
    <span class="cl-pointer" data-icon="pointer" style="left: 60px; top: 30px"></span>
    <span class="cl-pointer is-hand" data-icon="hand" style="left: 140px; top: 30px"></span>
  </div>
</template>

<!-- SNIPPET: Output menu open ================================================ -->
<template data-label="Output menu + the chip a pick leaves behind">
  <div class="surface" style="width: 420px">
    <!-- opens under the Output control, left edge on the control's pill, 11px below it (home) -->
    <div class="cl-controls" style="padding-left: 8px">
      <span class="cl-ctl is-open">Output <i class="cl-ic" data-icon="chevronDown"></i></span>
    </div>
    <div class="cl-menu cl-output-menu static-menu" style="margin-top: 11px">
      <div class="cl-menu-item"><span class="cl-tile is-docs"><i class="cl-ic" data-icon="docs"></i></span>Docs<span class="cl-beta">Beta</span></div>
      <div class="cl-menu-item is-hover"><span class="cl-tile is-slides"><i class="cl-ic" data-icon="slides"></i></span>Slides<span class="cl-beta">Beta</span></div>
      <div class="cl-menu-item"><span class="cl-tile is-design"><i class="cl-ic" data-icon="design"></i></span>Design<span class="cl-beta">Beta</span></div>
      <div class="cl-menu-sep"></div>
      <div class="cl-menu-item is-artifact"><i class="cl-ic" data-icon="artifacts"></i>Artifact<span class="cl-hint">Let Claude pick the format</span></div>
    </div>
    <!-- after a pick the Output control becomes a removable chip in that output's tile colour -->
    <div class="cl-controls" style="padding-left: 8px; margin-top: 14px">
      <span class="cl-chip-output is-docs" style="margin-left: 0">Docs <i class="cl-ic" data-icon="close"></i></span>
      <span class="cl-chip-output" style="margin-left: 10px">Slides <i class="cl-ic" data-icon="close"></i></span>
      <span class="cl-chip-output is-design" style="margin-left: 10px">Design <i class="cl-ic" data-icon="close"></i></span>
    </div>
  </div>
</template>

<!-- SNIPPET: + menu and Connectors submenu ==================================== -->
<template data-label="+ menu / Connectors submenu">
  <div class="surface row" style="width: 640px">
    <div class="cl-menu cl-plus-menu static-menu">
      <div class="cl-menu-item"><i class="cl-ic" data-icon="paperclip"></i>Add files or photos</div>
      <div class="cl-menu-item is-on"><i class="cl-ic" data-icon="globe"></i>Search the web<span class="cl-end"><i class="cl-ic" data-icon="check"></i></span></div>

      <div class="cl-menu-item"><i class="cl-ic" data-icon="plugins"></i>Plugins<span class="cl-end"><i class="cl-ic" data-icon="chevronRight"></i></span></div>
      <div class="cl-menu-item"><i class="cl-ic" data-icon="skills"></i>Skills<span class="cl-end"><i class="cl-ic" data-icon="chevronRight"></i></span></div>
    </div>
    <div class="cl-menu cl-connectors static-menu">
      <div class="cl-menu-item cl-back"><i class="cl-ic" data-icon="chevronLeft"></i>Back</div>
      <div class="cl-search-field"><i class="cl-ic" data-icon="search"></i>Search connectors</div>
      <!-- logos: use assets/logos/*.svg inside .cl-logo -->
      <div class="cl-menu-item"><span class="cl-logo"><i class="cl-ic" data-icon="docs"></i></span>Google Drive<span class="cl-toggle" data-icon="toggleOn"></span></div>
      <div class="cl-menu-item"><span class="cl-logo"><i class="cl-ic" data-icon="code"></i></span>GitHub<span class="cl-toggle" data-icon="toggleOn"></span></div>
      <div class="cl-menu-item"><span class="cl-logo"><i class="cl-ic" data-icon="calendar"></i></span>Calendar<span class="cl-toggle is-off" data-icon="toggleOff"></span></div>

      <div class="cl-menu-item"><i class="cl-ic" data-icon="connectors"></i>Browse connectors</div>

<!-- SNIPPET: messages ============================================================ -->
<template data-label="User message, assistant reply, action row, spark">
  <div class="surface" style="width: 640px">
    <div class="cl-msg-user"><div class="cl-bubble">Is the dashboard table using the same helper for the subtotal?</div></div>
    <div class="cl-msg-ai"><div class="cl-prose">
      <p>No. The subtotal is summed in <code>renderRows</code> and printed with <code>toFixed(2)</code>, which rounds half-even on some engines, so a subtotal can disagree with its own total by a cent.</p>
    </div></div>
    <div class="cl-actions">
      <span class="cl-iconbtn"><i class="cl-ic" data-icon="copy"></i></span>
      <span class="cl-iconbtn"><i class="cl-ic" data-icon="speaker"></i></span>
      <span class="cl-iconbtn"><i class="cl-ic" data-icon="thumbsUp"></i></span>
      <span class="cl-iconbtn"><i class="cl-ic" data-icon="thumbsDown"></i></span>
      <span class="cl-iconbtn"><i class="cl-ic" data-icon="retry"></i></span>
      <span class="cl-iconbtn"><i class="cl-ic" data-icon="wrench"></i></span>
    </div>
    <!-- the spark sits alone under the latest reply -->
    <span class="cl-spark cl-tail-spark" data-icon="spark"></span>
  </div>
</template>

<!-- SNIPPET: working indicator + step summary =================================== -->
<template data-label="Working indicator + step summary">
  <div class="surface" style="width: 640px">
    <!-- animate with SKIN_CLAUDE.sparkPulse(tl, sparkEl, t, dur) and SKIN_CLAUDE.shimmer(tl, subEl, t, dur) -->
    <div class="cl-working">
      <span class="cl-spark" data-icon="sparkAnimated"></span>
      <span class="cl-working-title">Building the launch deck</span>
      <span class="cl-working-sub"><span class="cl-shimmer" style="background-position: 45% 0">Adding the final touches</span><i class="cl-ic" data-icon="chevronRight"></i></span>
    </div>
    <div class="cl-msg-ai" style="margin-top: 18px"><div class="cl-prose"><p>Your deck is ready — eight slides, one job each.</p></div></div>
    <div class="cl-steps" style="font-size: 13.5px">Used artifacts, updated tasks, loaded tools <i class="cl-ic" data-icon="chevronRight"></i></div>

<script>
  // Gallery: render every template in light and dark.
  const g = document.getElementById('gallery');
  document.querySelectorAll('template').forEach((t) => {
    ['light', 'dark'].forEach((theme) => {
      const cell = document.createElement('div');
      cell.className = 'cell ' + theme;
      cell.innerHTML = '<div class="label">' + t.dataset.label + ' · ' + theme + '</div>';
      const root = document.createElement('div');
      root.className = 'sk-claude';
      root.setAttribute('data-theme', theme);
      if (t.dataset.zoom) root.style.zoom = t.dataset.zoom;
      root.appendChild(t.content.cloneNode(true));
      cell.appendChild(root);
      g.appendChild(cell);
    });
  });
  SKIN_CLAUDE.mountIcons(document);
</script>
