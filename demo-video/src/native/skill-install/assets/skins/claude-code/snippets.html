<!doctype html>
<!--
  Claude Code skin: canonical markup for every UI piece.
  Open this file in a browser (served next to assets/, or from a component's assets/skins/claude-code/)
  to see each snippet in light and dark. Copy the markup inside each <template>.

  Conventions
  - Everything lives under <div class="sk-cc" data-theme="light|dark">.
  - <i data-cc-icon="name"></i>  → desktop icon (SKIN_CLAUDE_CODE.mount fills it).
  - <i data-cc-g="name"></i>     → terminal glyph sized to one mono cell (❯ ● ⎿ ✻ ⏵⏵ ⏸ ✔ …).
  - Gutter glyphs that start a row go in <span class="cc-gut">…</span> so they share the text baseline.
  - Terminal size: set --cct-fs (font size) and --cct-lh (line height, 1.6 = official videos) on .cc-term.
  - Desktop sizes are the real app's CSS px. Scale a window with `zoom` (the demo uses 1.3–1.34).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Code skin: snippets</title>
<link rel="stylesheet" href="../../_shared/fonts/fonts.css">
<link rel="stylesheet" href="skin.css">
<script src="icons.js"></script>
<style>
  body { margin: 0; background: #e9e9e7; font: 13px/1.4 Inter, sans-serif; color: #333; }
  h1 { font: 600 20px Inter; margin: 24px 32px 4px; }
  .sec { margin: 28px 32px; }
  .sec > h2 { font: 600 14px Inter; margin: 0 0 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .pane { padding: 24px; border-radius: 10px; overflow: auto; }
  .pane.light { background: #f5f5f4; }
  .pane.dark { background: #0e0e0f; }
</style>
</head>
<body>
<h1>Claude Code skin: snippets</h1>

<!-- ================================================================== TERMINAL ================================================================== -->

<template class="snip" data-title="Tool calls: collapsed summary, running, done, error, Update with diff, ctrl+o hint">

    <!-- collapsed read/search group: dim, indented two cells -->
    <div class="cc-sum">Thought for 4s, searched for 1 pattern, read 2 files</div>
    <!-- running tool: grey ● (blink it while running) -->
    <div class="cc-t is-run cc-b"><span class="cc-gut"><i data-cc-g="dot"></i></span><span><span class="cc-tn">Bash</span>(pnpm vitest run api/orders)</span></div>
    <div class="cc-r"><span class="cc-gut"><i data-cc-g="elbow"></i></span><span class="cc-rb cc-dim">Running…</span></div>
    <!-- done: green ● + ⎿ result -->
    <div class="cc-t cc-b"><span class="cc-gut"><i data-cc-g="dot"></i></span><span><span class="cc-tn">Bash</span>(pnpm vitest run api/orders)</span></div>
    <div class="cc-r"><span class="cc-gut"><i data-cc-g="elbow"></i></span><span class="cc-rb">Tests  14 passed (14)</span></div>
    <!-- error: red ● -->
    <div class="cc-t is-err cc-b"><span class="cc-gut"><i data-cc-g="dot"></i></span><span><span class="cc-tn">Bash</span>(pnpm tsc --noEmit)</span></div>
    <div class="cc-r"><span class="cc-gut"><i data-cc-g="elbow"></i></span><span class="cc-rb"><span class="cc-err">Error: src/api/orders/types.ts(9,3): Property 'customerRef' does not exist</span></span></div>
    <div class="cc-r is-cont"><span></span><span class="cc-rb cc-dim">… +12 lines (ctrl+o to expand)</span></div>
    <!-- Update + diff: line no · sign · code; full-row tint, changed words darker -->
    <div class="cc-t cc-b"><span class="cc-gut"><i data-cc-g="dot"></i></span><span><span class="cc-tn">Update</span>(src/api/orders/handler.ts)</span></div>
    <div class="cc-r"><span class="cc-gut"><i data-cc-g="elbow"></i></span><span class="cc-rb">Updated <b>src/api/orders/handler.ts</b> with <b>1</b> addition and <b>1</b> removal</span></div>
    <div class="cc-r is-cont"><span></span><span class="cc-rb cc-diff">
      <span class="cc-dl"><span class="cc-ln">13</span><span> </span><span>  async getOrder(req, res) {</span></span>
      <span class="cc-dl is-rem"><span class="cc-ln">14</span><span>-</span><span>    const { <span class="cc-w-rem">customerRef</span> } = req.params;</span></span>
      <span class="cc-dl is-add"><span class="cc-ln">14</span><span>+</span><span>    const { <span class="cc-w-add">accountRef</span> } = req.params;</span></span>
      <span class="cc-dl"><span class="cc-ln">15</span><span> </span><span>    const order = await orders.find(id);</span></span>
    </span></div>
  </div></div>
</template>

<script>
  // render every template twice (light | dark) and fill icons + the deterministic heatmap
  document.querySelectorAll('template.snip').forEach(function (t) {
    var sec = document.createElement('div'); sec.className = 'sec';
    sec.innerHTML = '<h2></h2><div class="pair"></div>';
    sec.querySelector('h2').textContent = t.getAttribute('data-title');
    ['light', 'dark'].forEach(function (th) {
      var pane = document.createElement('div'); pane.className = 'pane ' + th;
      var root = document.createElement('div'); root.className = 'sk-cc'; root.setAttribute('data-theme', th);
      root.appendChild(t.content.cloneNode(true)); pane.appendChild(root);
      sec.querySelector('.pair').appendChild(pane);
    });
    t.parentNode.insertBefore(sec, t);
  });
  document.querySelectorAll('[data-heat]').forEach(function (el) {
    var h = '';
    for (var i = 0; i < 26 * 7; i++) { var x = Math.sin(i * 3.17 + 1.3) * 9301.17; x = x - Math.floor(x); h += '<i class="' + (x < .35 ? '' : 'h' + (1 + Math.floor((x - .35) / .1625))) + '"></i>'; }
    el.innerHTML = h;
  });
  SKIN_CLAUDE_CODE.mount(document);
</script>
