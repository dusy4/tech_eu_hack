<!doctype html>
<!--
  OpenAI Codex skin: canonical markup for every UI piece.
  Open this file directly to preview it (paths below are relative to library/_skins/codex/).
  In a component use:
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <link rel="stylesheet" href="assets/skins/codex/skin.css">
    <script src="assets/skins/codex/icons.js"></script>
  then call  window.SKIN_ICONS_CODEX.mount(rootEl)  after building the DOM (fills every [data-cx-icon]).
  Theme: data-theme="light|dark" on the .sk-codex root (or on any ancestor).
  Sizes are logical macOS points. Scale the window from a wrapper: <div style="transform:scale(1.2);transform-origin:0 0">.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Codex skin snippets</title>
<link rel="stylesheet" href="../../_shared/fonts/fonts.css">
<link rel="stylesheet" href="skin.css">
<script src="icons.js"></script>
<style>
  body { margin: 0; background: #e9e9e7; font-family: Inter, sans-serif; }
  .sheet { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 40px; }
  .sheet > section { display: flex; flex-direction: column; gap: 28px; }
  .sheet > section[data-theme="dark"] { background: #0e0e0f; margin: -40px -40px -40px 0; padding: 40px; }
  h2 { font: 600 13px Inter, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: #888; margin: 8px 0 -16px; }
  .box { position: relative; }
</style>
</head>
<body>
<div class="sheet">
<section data-theme="light" id="light"></section>
<section data-theme="dark" id="dark"></section>
</div>

<template id="pieces">

<!-- ====================================================================
     1. WINDOW CHROME (ChatGPT desktop app, Codex section)
     .cx-window > .cx-titlebar + .cx-body(.cx-rail + .cx-panel)
     Title bar variants:
       a) home: traffic lights, back, forward (dimmed = .is-off), sidebar toggle; new-tab icon far right
       b) thread / PR: + vertical .cx-tb-sep, a main tab (.cx-tab, chat-bubble or PR icon, no fill, × at right),
          and right-panel tabs (.cx-tb-side) where the active tab is a white pill (.cx-tab.is-active)
     Set --cx-lead-w to rail + sidebar width so the main tab lines up with the main column.
     ==================================================================== -->
<h2>Window + rail + empty home</h2>
<div class="sk-codex cx-window" style="width:820px;height:470px">
  <div class="cx-titlebar">
    <div class="cx-tb-lead">
      <div class="cx-traffic"><i></i><i></i><i></i></div>
      <span class="cx-tb-btn"><span class="cx-i" data-cx-icon="arrow-left"></span></span>
      <span class="cx-tb-btn is-off"><span class="cx-i" data-cx-icon="arrow-right"></span></span>
      <span class="cx-tb-btn"><span class="cx-i" data-cx-icon="sidebar"></span></span>
    </div>
    <div class="cx-tb-right"><span class="cx-tb-btn"><span class="cx-i" data-cx-icon="new-tab"></span></span></div>
  </div>
  <div class="cx-body">
    <!-- 2. ICON RAIL: home (filled when active, blue dot = new activity), cards, history, plugins, more | code review, ChatGPT, scheduled; app avatar at the bottom -->
    <div class="cx-rail">
      <span class="cx-rail-btn is-active"><span class="cx-i" data-cx-icon="home-fill"></span><i class="cx-rail-dot"></i></span>
      <span class="cx-rail-btn"><span class="cx-i" data-cx-icon="cards"></span></span>
      <span class="cx-rail-btn"><span class="cx-i" data-cx-icon="clock"></span></span>
      <span class="cx-rail-btn"><span class="cx-i" data-cx-icon="plugins"></span></span>
      <span class="cx-rail-btn"><span class="cx-i" data-cx-icon="more"></span></span>
      <i class="cx-rail-div"></i>
      <span class="cx-rail-btn"><span class="cx-i" data-cx-icon="pr"></span></span>
      <span class="cx-rail-btn"><span class="cx-i" data-cx-icon="openai"></span></span>
      <span class="cx-rail-btn"><span class="cx-i" data-cx-icon="calendar"></span></span>
      <div class="cx-rail-foot"><span class="cx-avatar-app"><span class="cx-i" data-cx-icon="openai"></span></span></div>
    </div>
    <!-- inset panel: rounded 12pt card sitting 5pt inside the window's right/bottom edges -->
    <div class="cx-panel">
      <div class="cx-main">
        <!-- 4. EMPTY-STATE HOME: outlined Codex mark + "What should we build?" -->
        <div class="cx-home">
          <div class="cx-home-logo" data-cx-icon="codex"></div>
          <div class="cx-home-title">What should we build?</div>
        </div>
        <div class="cx-dock" style="--cx-composer-max:600px">
          <div class="cx-cwrap">
            <!-- context tray: tucks under the composer's top edge -->
            <div class="cx-tray">
              <span class="cx-tray-chip is-dim"><span class="cx-i" data-cx-icon="folder"></span>Choose project</span>
              <span class="cx-tray-chip"><span class="cx-i" data-cx-icon="laptop"></span>This computer</span>
            </div>
            <div class="cx-composer">
              <div class="cx-input"><span class="cx-caret"></span><span class="cx-placeholder">Do anything</span></div>
              <div class="cx-cfoot">
                <span class="cx-cbtn"><span class="cx-i" data-cx-icon="plus"></span></span>
                <span class="cx-perm"><span class="cx-i" data-cx-icon="gear"></span>Custom</span>
                <span class="cx-grow"></span>
                <span class="cx-model"><span class="cx-i cx-bolt" data-cx-icon="bolt"></span>GPT-6 Astra <span class="cx-effort">Medium</span><span class="cx-i cx-chev" data-cx-icon="chevron-down"></span></span>
                <span class="cx-cbtn"><span class="cx-i" data-cx-icon="mic"></span></span>
                <span class="cx-send" data-state="empty"><span class="cx-i cx-i-send" data-cx-icon="send"></span><span class="cx-i cx-i-stop" data-cx-icon="stop"></span></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

     Typing: put text in a span before .cx-caret and drop the .cx-placeholder.
     Mention chip: <span class="cx-mention"><img src="…"> Plugin Creator</span>

        <span class="cx-grow"></span>

        <span class="cx-cbtn"><span class="cx-i" data-cx-icon="mic"></span></span>
        <span class="cx-send" data-state="ready"><span class="cx-i cx-i-send" data-cx-icon="send"></span><span class="cx-i cx-i-stop" data-cx-icon="stop"></span></span>
      </div>
    </div>
  </div>
</div>
<div class="sk-codex" style="width:640px">
  <div class="cx-composer">
    <div class="cx-input"><span class="cx-placeholder">Do anything</span></div>
    <div class="cx-cfoot">
      <span class="cx-cbtn"><span class="cx-i" data-cx-icon="plus"></span></span>
      <span class="cx-perm"><span class="cx-i" data-cx-icon="gear"></span>Custom</span>
      <span class="cx-grow"></span>
      <span class="cx-model"><span class="cx-i cx-bolt" data-cx-icon="bolt"></span>GPT-6.1 Sol <span class="cx-effort">Medium</span><span class="cx-i cx-chev" data-cx-icon="chevron-down"></span></span>

<!-- compact single-row composer (narrow right panel / Code Review thread) -->
<div class="sk-codex" style="width:540px">
  <div class="cx-composer is-compact">
    <span class="cx-cbtn"><span class="cx-i" data-cx-icon="plus"></span></span>
    <div class="cx-input"><span class="cx-placeholder">Do anything</span></div>

    <span class="cx-send" data-state="empty"><span class="cx-i cx-i-send" data-cx-icon="send"></span></span>
  </div>
</div>

        fromTo(menu, {opacity:0, scale:.96, y:6}, {opacity:1, scale:1, y:0, duration:.24, ease:"expo.out"}).

    <span class="cx-tray-chip is-open"><span class="cx-i" data-cx-icon="laptop"></span>This computer</span>

</div>
<!-- tray after choosing Cloud [EXTRAPOLATED order + cube glyph; UI-NOTES: tray switches to "Cloud" + "Choose environment"] -->

  <div class="cx-tray" style="margin:0 15px;padding-bottom:7px;border-radius:16px">

<!-- ====================================================================

<!-- ====================================================================
     8–11. THREAD: user bubble (right, light blue) · "Worked for …" separator · unbubbled reply · action row ·
     "Edited N files" card.  Live state: .cx-worked > span.cx-shimmer "Working for 1m 17s" + .cx-status-sub
     ==================================================================== -->
<h2>Thread</h2>
<div class="sk-codex" style="width:620px;background:var(--cx-panel);padding:20px 26px;border-radius:12px">
  <div class="cx-user"><div class="cx-bubble">Totals are off by a cent on some carts. Find the cause, fix it, and run the tests.</div></div>
  <div class="cx-worked"><span class="cx-shimmer">Working for 1m 17s</span></div>
  <div class="cx-status-sub">Running npm test</div>
  <div class="cx-worked">Worked for 1m 19s<span class="cx-i" data-cx-icon="chevron-right"></span></div>
  <div class="cx-ai">
    <p>Each line item was rounded before it was added to the subtotal. I moved rounding into <code>computeTotal()</code> and added a regression test.</p>
    <p><span class="cx-i" data-cx-icon="github" style="width:14px;height:14px;color:var(--cx-link);vertical-align:-2px"></span> <a>Posted the reply</a> with the test results.</p>
  </div>
  <div class="cx-files">
    <div class="cx-files-head">
      <span class="cx-files-tile"><span class="cx-i" data-cx-icon="diff"></span></span>
      <div><div class="cx-files-title">Edited 2 files</div><div class="cx-files-counts"><span class="cx-plus">+7</span> <span class="cx-minus">-2</span></div></div>
      <span class="cx-files-undo">Undo<span class="cx-i" data-cx-icon="undo"></span></span>
      <span class="cx-btn">Review</span>
    </div>
    <div class="cx-files-row"><span class="dir">src/cart/</span>total.ts<span class="cnt"><span class="cx-plus">+2</span> <span class="cx-minus">-2</span></span></div>
    <div class="cx-files-row"><span class="dir">src/cart/</span>total.test.ts<span class="cnt"><span class="cx-plus">+5</span> <span class="cx-minus">-0</span></span></div>
  </div>
  <div class="cx-actions"><span class="cx-ib"><span class="cx-i" data-cx-icon="copy"></span></span><span class="cx-ib"><span class="cx-i" data-cx-icon="thumb-up"></span></span><span class="cx-ib"><span class="cx-i" data-cx-icon="thumb-down"></span></span><span class="cx-ib"><span class="cx-i" data-cx-icon="fork"></span></span></div>
</div>

<!-- ====================================================================
     12. APPROVAL REQUEST (desktop) [EXTRAPOLATED: replaces the composer while Codex waits]

<div class="sk-codex" style="width:620px">

<!-- ====================================================================

<h2>Diff panel</h2>
<div class="sk-codex" style="display:flex;height:300px;border-radius:12px;overflow:hidden">
  <div class="cx-rpanel" style="--cx-rp-w:560px;border-left:0">
    <div class="cx-rp-head">
      <span class="cx-pill">Uncommitted changes <span class="cx-plus">+32</span> <span class="cx-minus">-3</span><span class="cx-i" data-cx-icon="chevron-down"></span></span>
      <span class="cx-pill-group"><span class="cx-ib"><span class="cx-i" data-cx-icon="more"></span></span><span class="cx-ib"><span class="cx-i" data-cx-icon="list-filter"></span></span><span class="cx-ib"><span class="cx-i" data-cx-icon="copy"></span></span></span>
    </div>
    <div class="cx-dfile"><span class="cx-badge ts">TS</span><span><span class="dir">src/cart/</span>total.ts</span><span class="cnt"><span class="cx-plus">+27</span> <span class="cx-minus">-3</span></span><span class="cx-ib"><span class="cx-i" data-cx-icon="more"></span></span></div>
    <div class="cx-code">
      <div class="cx-unmod">11 unmodified lines</div>
      <div class="cx-ln"><span class="n">12</span><span class="c"><span class="tk-k">export</span> <span class="tk-k">function</span> <span class="tk-f">roundCents</span>(<span class="tk-p">value</span>: <span class="tk-p">number</span>) {</span></div>
      <!-- changed rows: the gutter keeps a paler wash and the NUMBER takes the colour; the code cell gets the full tint -->
      <div class="cx-ln del"><span class="n">13</span><span class="c">  <span class="tk-k">return</span> <span class="tk-p">Math</span>.<span class="tk-f">round</span>(<span class="tk-p">value</span> * <span class="tk-n">100</span>) / <span class="tk-n">100</span>;</span></div>
      <div class="cx-ln add"><span class="n">13</span><span class="c">  <span class="tk-k">return</span> <span class="tk-p">Math</span>.<span class="tk-f">round</span>((<span class="tk-p">value</span> + <span class="tk-p">Number</span>.<span class="tk-p">EPSILON</span>) * <span class="tk-n">100</span>) / <span class="tk-n">100</span>;</span></div>
      <div class="cx-ln"><span class="n">14</span><span class="c">}</span></div>
    </div>
  </div>
</div>

<!-- ====================================================================
     15. CLI (Codex TUI). .cx-term window; lines are .cx-tl rows (monospace, pre-wrap, 22pt side padding).
     Bullets "•" sit at col 0, header text at col 2. User prompts are a full-width band (.cx-t-band).
     Tool calls: "• Explored / Edited / Ran" + "└" tree rows. Final answer after the "─ Worked for …" rule.
     Bottom: working status (shimmer), composer band (.cx-t-composer), status line (yellow) + hints.
     ==================================================================== -->
<h2>CLI</h2>
<div class="sk-codex cx-term" style="width:640px;height:auto">
  <div class="cx-term-bar"><div class="cx-traffic"><i></i><i></i><i></i></div>checkout-web — codex</div>
  <div class="cx-term-body" style="--cx-t-size:12.5px">
    <div class="cx-tl">  <span class="cx-t-strong">&gt;_</span> <span class="cx-t-b">OpenAI Codex</span> <span class="cx-t-dim">(v0.159.0-alpha.13)</span></div>
