<!doctype html>
<!--
  ChatGPT skin: canonical snippets (Oct 2026).
  Open this file in a browser to see every piece in light and dark.
  Copy the markup inside each <template> into a component.

  In a component:
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <link rel="stylesheet" href="assets/skins/chatgpt/skin.css">
    <script src="assets/skins/chatgpt/icons.js"></script>
    ... markup inside <div class="sk-chatgpt" data-theme="light|dark" [data-accent="green|blue"]> ...
    <script> SKIN_ICONS_CHATGPT.mount(document); </script>   // fills every <i class="cg-i" data-i="…">

  Every size is the real product's CSS px. Present it with `zoom` on a wrapper:
  ~1.1 for chatgpt.com (24px answer prose), ~1.5 for the desktop app (16px prose), ~1.6 for iOS.
  Pieces marked [EXTRAPOLATED] have no official frame; see DECISIONS.md.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ChatGPT skin snippets</title>
<link rel="stylesheet" href="../../_shared/fonts/fonts.css" />
<link rel="stylesheet" href="../../fonts/fonts.css" />
<link rel="stylesheet" href="skin.css" />
<script src="icons.js"></script>
<style>
  body { margin: 0; background: #e9e9e7; font-family: Inter, sans-serif; }
  .gallery { display: grid; grid-template-columns: 1fr 1fr; }
  .cell { padding: 28px; position: relative; overflow: hidden; }
  .cell.light { background: #f5f5f4; }
  .cell.dark { background: #0e0e0f; }
  .label { font: 500 12px Inter, sans-serif; color: #888; margin: 0 0 14px; letter-spacing: .02em; text-transform: uppercase; }
  .surface { background: var(--cg-page); border-radius: 14px; padding: 28px; position: relative; }
  .stack { display: flex; flex-direction: column; gap: 18px; align-items: center; }
  .static { position: static !important; }
</style>
</head>
<body>
<div class="gallery" id="gallery"></div>

<!-- ======================================================================
     1. chatgpt.com WINDOW: icon rail · top bar (Chat | Work) · home greeting · idle composer
        Root: .sk-chatgpt.cg-web (fills its box; give the box a size). .cg-window adds the
        floating-window radius, hairline and shadow for a stage.
        Rail order (official GDP demo): knot · new chat · search · library · pinned · chats; avatar at the foot.
        A Work/Business account rail is: home (filled + green dot) · Space · clock · @ · ⋯  (Monty Hall demo).
     ====================================================================== -->
<template data-label="chatgpt.com home" data-zoom="0.55">
  <div class="sk-chatgpt cg-window cg-web" style="width:1274px;height:718px">
    <nav class="cg-rail">
      <div class="cg-rail-btn is-logo"><i class="cg-i" data-i="knot"></i></div>
      <div class="cg-rail-btn"><i class="cg-i" data-i="edit"></i></div>
      <div class="cg-rail-btn"><i class="cg-i" data-i="search"></i></div>
      <div class="cg-rail-btn"><i class="cg-i" data-i="library"></i></div>
      <div class="cg-rail-btn"><i class="cg-i" data-i="pin"></i></div>
      <div class="cg-rail-btn"><i class="cg-i" data-i="chat"></i></div>
      <div class="cg-rail-foot"><div class="cg-avatar"><i class="cg-i" data-i="knot"></i></div></div>
    </nav>
    <div class="cg-top">
      <div class="cg-top-left"></div>
      <div class="cg-top-center"><div class="cg-toggle"><span class="is-on">Chat</span><span>Work</span></div></div>
      <div class="cg-top-right"><div class="cg-top-btn"><i class="cg-i" data-i="chat-dashed"></i></div></div>

        <div class="cg-c-plus"><i class="cg-i" data-i="plus"></i></div>

        </div>
      </div>
    </div>
  </div>
</template>

        Account colour green (the demos' Work account): pale-green user pill, green-tinted streaming, green ■.
        Title: Chrome fades a long tab title at its right edge (mask on .cg-browser-title); keep titles short enough

<script>
  // Gallery: render every template in light and dark.
  const g = document.getElementById('gallery');
  document.querySelectorAll('template').forEach((t) => {
    ['light', 'dark'].forEach((theme) => {
      const cell = document.createElement('div');
      cell.className = 'cell ' + theme;
      cell.innerHTML = '<div class="label">' + t.dataset.label + ' · ' + theme + '</div>';
      const root = document.createElement('div');
      root.className = 'sk-chatgpt';
      root.setAttribute('data-theme', theme);
      if (t.dataset.zoom) root.style.zoom = t.dataset.zoom;
      root.appendChild(t.content.cloneNode(true));
      cell.appendChild(root);
      g.appendChild(cell);
    });
  });
  SKIN_ICONS_CHATGPT.mount(document);
</script>
